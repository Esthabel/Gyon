<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>乐高们的答案之书</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(120% 120% at 50% 0%, #2b2240 0%, #1b1530 45%, #120e22 100%);
  color:#f5efe4;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  -webkit-tap-highlight-color:transparent;
}
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.6;}
.stars i{position:absolute;background:#fff;border-radius:50%;animation:tw 4s infinite;}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
/* 右下角小羊 logo（抠图，白羊毛实心保留） */
.sheep-logo{
  position:fixed;right:14px;bottom:14px;
  width:88px;height:auto;opacity:.97;
  pointer-events:none;z-index:10;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));
}
.book{
  position:relative;
  width:100%;max-width:470px;
  background:linear-gradient(160deg,#faf6ec 0%,#f3ecd9 100%);
  color:#3a2f25;
  border-radius:14px 14px 8px 8px;
  padding:30px 24px 26px;
  box-shadow:0 30px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6);
  text-align:center;
  display:flex;flex-direction:column;
}
.badge{
  display:inline-block;font-size:11px;letter-spacing:3px;color:#8a7153;
  border:1px solid #cfc0a6;border-radius:20px;padding:4px 14px;margin:0 auto 12px;
}
h1{font-size:25px;letter-spacing:4px;color:#3a2f25;font-weight:600;margin-bottom:16px;}
.sec{font-size:11px;letter-spacing:2px;color:#a8926f;margin-bottom:6px;text-align:left;}
.q-box{
  background:#f0e8d4;border:1px solid #e0d3b6;border-radius:8px;
  padding:13px 16px;margin-bottom:14px;text-align:left;
  min-height:50px;max-height:120px;overflow-y:auto;
}
.q-text{font-size:15px;line-height:1.7;color:#5a4a33;white-space:pre-wrap;word-break:break-word;}
.answer-box{
  background:#fffdf6;border:1px solid #e4d9c2;border-radius:8px;
  padding:15px 16px;margin-bottom:18px;text-align:left;
  min-height:130px;max-height:42vh;overflow-y:auto;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.05);
}
.a-text{font-size:16px;line-height:1.8;color:#4a3d2c;white-space:pre-wrap;word-break:break-word;}
.placeholder{color:#b3a488;text-align:center;line-height:1.7;font-size:15px;}
button{
  font-size:16px;letter-spacing:2px;color:#f7f1e3;
  background:linear-gradient(135deg,#8a5a44,#6d452f);
  border:none;border-radius:99px;
  padding:13px 40px;cursor:pointer;margin:0 auto;
  box-shadow:0 6px 16px rgba(109,69,47,.4);
  transition:transform .15s,box-shadow .15s;
}
button:active{transform:scale(.96);box-shadow:0 3px 8px rgba(109,69,47,.4);}
.foot{margin-top:14px;font-size:11px;color:#a8947a;letter-spacing:1px;}
.foot .cnt{color:#6d452f;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

初体验奋战到凌晨三点，收获夜光马桶盖两个地漏网三百个"}, {"q": "乐高觉得高杨最不想让新“乐高们”知道的“冷知识”是什么？", "a": "可能是高中的小肥羊时期吧，除此之外哥们好像对什么都挺坦荡的"}, {"q": "猜一猜高哥在“阿姆斯特丹”海边到底立志一定要做到的事情是什么?", "a": "出人头地?不被束缚?也许等我有机会去到这个海边会感同身受。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "谢谢你坚定地做着自己。请你继续按着自己看到的那条路走的去。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "哥好我也好。\n高哥，身体健康，生活愉快，赚赚大钱，多多人爱"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "q1更多的是敬佩\nq2请继续无畏地，自信地做你想做的事吧！"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近在读《呼啸山庄》，还没读完……好复杂的人名和伦理关系！！"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "希望总有一天。想看侦探类，表达真相和光明总会冲破迷雾与黑暗。"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "期待\n我想看悬疑！悬疑！\n价值观...遵循自己的本心去生活吧"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "少爷，因为看完长腿叔叔后觉得真的是很俏皮又有风度的富家少爷。"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "能抛弃一切电子设备，只用眼睛记录下高杨演艺生涯的moment"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "书：微积分\n题材：教材\n感悟：老天爷，这就是醍醐灌顶吗😱😱"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《易地思之》，题材是强制爱，读后感是内容太猎奇了，人类不要看。"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "想去看极光，想去北欧感受慢生活，享受“造物主”创造的美妙世界。"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "最想回到深圳光明李二狗巡演那天，因为我在第一排接到了他上班！！"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "gygg（高杨哥哥）\n还没到八十三岁，叫叔叔显老，叫哥哥正好！"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "一直喜欢叫高杨“羊”，这就是他在我心中的形象，白白净净的小羔羊"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "国际经济与贸易（快跑）是一个万金油专业 也可以说啥都学啥都不精"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "想羊了\n生活太累了吸羊/进剧院放松一下\n见一个能让自己充电的人"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "你们真的太厉害了，诗歌什么的我还要再思考一下，这也不是一下就能"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "最喜欢的还是高杨唱古典，艺术歌曲，爵士/民谣/国风也会很有味道"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "没有，用不完加我联系方式，我告诉他地址可以寄给我（夹带私货中）"}, {"q": "“鸟巢演唱会”是否纳入下一个5年计划？或者10年计划呢？", "a": "必须纳入！我召集全家老小一起支持高哥，鸟巢必须全部坐满坐满！！"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "自深深处，王尔德的自白吧，剖析自己是痛苦的，但不照见自己是可怕的"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "想看一些轻松青春向的群像剧！价值观就是快乐万岁（守法前提下（））"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "28年？想看文物主题，音乐剧版的：博物馆奇妙夜和如果文物会说话！"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "每一次！因为每次见面都是独一无二的！是美好的也是记忆中永恒存在的"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "第一次看长腿，想告诉他：“你真的很厉害，而且以后会越来越厉害！”"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "q1建一座剧院\nq2世界和平；我爱的人都能平安顺遂；灯神能够自由"}, {"q": "乐高觉得高杨最不想让新“乐高们”知道的“冷知识”是什么？", "a": "早期比较苦的日子 我觉得他不是喜欢把自己的伤口揭露给别人看的性格"}, {"q": "猜一猜高杨会说什么？看了19年“小剧场”那幅画之后，总是忍不住“跷二郎腿”，怎么办？", "a": "嘿嘿嘿～（高哥专属笑声）你们要是爱翘以后见面就用这个姿势打招呼吧"}, {"q": "“鸟巢演唱会”是否纳入下一个5年计划？或者10年计划呢？", "a": "等待！永远在等待！“鸟巢演唱会”我将永远等待！直到看上的那一天！"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "想回到刚认识高杨的时候，重生一世这次我不会再错过已毕业角色💪🏻"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "买票，买一排一\n前两个愿望是高杨演出场场不落，第三个愿望是放灯神走"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "我平时叫他小高/小羊，见面叫高哥，都很喜欢~因为是高杨所以都喜欢！"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "“羊儿”，听起来就像会咩咩叫的白白的软软的但是有劲儿会顶人的小动物"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "帅照。。。这肩宽这脸蛋这长腿哎呀哎呀(还有萌萌胎记()真的很萌的！"}, {"q": "乐高们最愿意听到你如何称呼大家：________", "a": "其实还蛮喜欢直接叫乐高的,毕竟是赐名来的(但想听高杨叫姐姐妹妹们嗯"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "想近距离看看他听他说话 虽然但是结束之后都觉得像做了一场很盛大的梦"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "圆自己17岁的梦，看他演出的同时，也会感慨时间流逝太快他有好大进步"}, {"q": "猜一猜高杨会说什么？看了19年“小剧场”那幅画之后，总是忍不住“跷二郎腿”，怎么办？", "a": "跷二郎腿虽然说对脊柱不好，但我无聊时还是会翘腿，也是一种放松方式嘛"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "先好好睡一觉，然后带着小猫去宠物友好的地方，啊有了猫就没那么自由了。"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "现在还在上学\n如果有经济能力，想当画家或者手工艺人\n（自由职业一点）"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "想回到最早的那一轮长腿，告诉高杨不要紧张，敢于站上舞台已经很不错啦！"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "就叫高杨，因为看起来是一种有距离的称呼，喜欢永远保持台上与台下的距离"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "高杨今天在哪上班算吗…每天都在和同好感叹高哥强大的精力和强大的执行力"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "会计学！！不要学会计你会变得不幸（但是其实我之前有想过学新闻传媒类的"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "计科\n（如果🐑当文化生，会选哲学？🤨反正肯定不是计算机对吧🫣）"}, {"q": "乐高觉得高杨最不想让新“乐高们”知道的“冷知识”是什么？", "a": "可能是中专的学历？但高哥已经很厉害了！学历绝不是评价一个人的唯一标准"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "我们乐高！非常之棒！感觉能喜欢上高杨，成为乐高就是一件很幸福的事情！"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "感觉高哥很适合一些舒缓直叙的歌，古风也很适合，但是很期待高哥唱R&B"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "古典一张，流行一张，电子摇滚rap一张，R&B爵士一张，民谣国风一张"}, {"q": "“鸟巢演唱会”是否纳入下一个5年计划？或者10年计划呢？", "a": "可以，最好五年吧，那时候应该还在北京读博，十年后我就不知道干什么去了"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "很少看书，最近的话是教育学的，读后在思考怎么才能更好地实践“因材施教”"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "未来一定会有的\n民国，爱国的吧\n自立自强，爱国，敬业，友谊地久天长？）"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "新疆，想去看看赛里木湖\n高杨的话，会想回维也纳转一转，回梅溪湖逛一逛吗"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "想去唱歌，纯喜欢唱歌。但是想让高杨试试教书，感觉他的教育风格会很有意思"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "是声入人心巡演，是初次的长腿。我想参与你的曾经 现在 未来 不只是线上"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "今年济南长腿。因为我在二楼前排但没带望远镜也没借到，好想看一眼表情啊！"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "2018年声入人心时期，那时候我就可以早点认识他了，看他再唱一次白月光"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "2019年，可以早点开始看高杨的音乐剧，没有看上最早的长腿是一直的遗憾"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "晏晏，羊羊读音的近语，听上去很婉转，而且言笑晏晏，看上去很像开心的高哥"}, {"q": "乐高最爱的“小剧场”的哪个主题：________", "a": "新疆！大美新疆欢迎我！(其实都很喜欢,每个主题带来的都是不同的“高杨”"}, {"q": "乐高们最喜欢你的哪句羊言羊语（名羊名言）？", "a": "我一个人在阿姆斯特丹的海边,在沙滩上写字,想着要是做不到就从这里跳下去"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "文科生不知道选什么但相信未来的自己会选择适合自己的专业\n🐑去学哲学！"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "用完了吧。\n7年一年用个40个\n但是不排除不好用于是直接不用了的可能性"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近在读《三体》，是硬科幻题材的小说。在体会人与人性以及宇宙共生的问题。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "悬疑类的《嫌疑人X的献身》，原来一个人真的可以为了另一个人抛弃自己的未来"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "他总是淡淡的接受所有事情，对事物的理解和看法都很触动我，让我学习和思考。"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "高杨还是高杨，但是他大概会找个大柜子把所有乐高一排一排摆进去每天路过欣赏"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "看着高杨在自己热爱的舞台上闪闪发光，在自己喜欢的领域享受音乐、享受人生。"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "出实体专辑能不能多做一点，让我能抢到一张！！歌的话是高哥唱的都喜欢嘻嘻！"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "没有，我估摸着会在他家里落灰，实在不行高哥把那个三百个地漏找个sd发了吧"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《我的天才女友》，小说。去读书，去学习，去受教育，去冲破束缚，去闯荡世界。"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "阮籍，又能喝酒又能接受最好的文学和音乐熏陶（竹林七贤）影响一个时代的风尚。"}, {"q": "在你印象里，乐高之间身上最统一、最明显的特质是什么？", "a": "不惹事，也不怕事，每次有事情，看到乐高们开始一系列翻相册，就觉得心里暖暖的"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "期待高杨可以带来更好的作品！想看叙事类的，高总自己部分人生经历其实就很励志"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "冰岛冰岛冰岛\n一切都要从《白日梦想家》这个电影说起…真正的北欧宣传片来了…"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "我想当作家。虽然现在想法总是很现实，但是我其实也想写出很多天马行空的故事～"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "声入人心结束的时候吧\n想告诉他他真的很厉害，后来他真的成为了很好很好的人！"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "去上海定居\n1.变成有钱人！！！！\n2.我磕的CP都是真的！\n3.世界和平"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "高杨会变成皮卡丘（）大战乐高（？）\n开玩笑，高杨应该会变成乐高经销商嗯（）"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "小羊？因为很可爱吧，其实羊羊、高哥什么都叫过，都很喜欢（有时候还会叫高大爷"}, {"q": "乐高觉得高杨最不想让新“乐高们”知道的“冷知识”是什么？", "a": "唐探的那次水手服（？其实觉得高杨会说既然是冷知识那就都不说全烂在肚子里哈哈"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "国风古风？感觉嗓子很适合啊！但是支持玩音乐，多探索类型！rap一段也可以…"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "想看重金属羊诶哈哈哈哈，看了吾湖伴着重金属睡觉的羊感觉真的很反差。好期待。"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "站在舞台上眼睛亮亮的看着台下的观众，每次sd出现的时候漂亮的小杨都会牵动心弦"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "当他认为自己做演员已经到位的时候。\n题材方面百无禁忌。\n价值观别太扭曲就好。"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "工艺品制作（现在的工作和人交流太多了…实在不想再和人交流了，高杨和乐高除外）"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "我想回srrx节目刚结束开始巡演的时候😭我为什么在最应该追他们的时候读书。"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "最想回到一轮长腿的时候和高杨见面，因为想作为忠实的观众，在台下坚定的支持他。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "给我们高老板投资！猛猛排想要的喜欢的剧 把他想演的管他国外国内的都给搬回来！"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "①跟着叽歪跑全部行程\n②拥有一台特别好的相机，变成亿万富翁，每天可以看到高杨"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "其实一般是我听别人给我讲xixi 我分享的话一般是:🐑今天又被垃圾桶挑衅了"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "谢谢你一路走来的坚持，谢谢你一如既往的热爱。想说：辛苦了！吃好睡好，下次见！"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "石香姑。想看一看广阔的大海，在海浪里建立事业，独立能干，做自己的主人真的很厉害"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "悬疑推理题材，类似《大侦探》那种，剖析社会现实，挑战人性，直击心灵的那种类型。"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "我觉得高哥的话，很快就能看到了\n题材倒是无所谓，好看就行\n正能量正能量正能量！"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "18年的高杨。想了解面对人生的一个节点的态度，即学习和工作转换时的思考和行动。"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "录取结果还没出来，我就写一个最可能录取的吧（机械制造及自动化或者电气自动化吧）"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "是面对挫折依然坚定包容地走下去。这给予了我力量去面对我生活或者求学生涯中的困难。"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "希望30+会出现这样的剧，生活流吧，亲情爱情等人类美好的情感～温暖又治愈的轻松剧"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "作为一个农学生，我最先想到的是大海，黑土地，比人还高的玉米，一个背影眺望着前方，"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿就拿去投项目，做剧把我想要的卡司集齐。让我成为灯神，身体健康，财源滚滚。"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "国风，很爱《灯影探花》好听好听，古典也很不错，喜欢《My time》的恢宏编曲。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "去重读简爱了\n其实原著里并不喜欢罗切斯特所以非常期待剧版会带来一个什么样的新的感受"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "武则天或者伊丽莎白二世，登基当女皇，其实是因为前段时间在看武皇还有伊二相关的作品。"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "sd的时候对待谁都很温柔，以及很有耐心，d的人心里暖暖的！\n笑！！！最可爱了！！！"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "2019-2020\n他刚刚步入音乐剧行业，想跟他说：大胆去做吧，未来的你超级优秀！"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近没读什么书，一直在上课，真要算的话应该是《金融企业会计》。没什么感悟，很难有感悟"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "明明是在面对很大困难很大压力，但是依然冷静，势在必得，有种“相信我我能解决”的踏实感"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "自由职业，旅游博主吧，喜欢到处走走\n或者其实我还是想当兵的，以前想过为国牺牲也挺好的"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "中学生\n舞台设计或者舞台服装设计\n文化生的话，想学经济管理类或者生物科学，材料科学。"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "看到高杨诠释好每一个角色 看着舞台上展现出🐑对这个角色的理解 看着他在台上闪闪发光"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "一定没有！就高杨回家的频率和住在家里的时间来看，这300个地漏可能还能在40岁相见。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "六个说谎的大学生\n悬疑成长\n这个世界有点复杂。人性难测。\n成长是一趟旅程。请重在体验！"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "三毛。\n我很爱她，爱她笔下的文字，爱她的眼睛。我想看看她的灵魂，想出发她脑回路的一点。"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "想去新疆，因为高杨，也不止因为高杨。想去看看那片广袤的土地，也想去看看高杨长大的地方。"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "羊 邪恶摇粒绒。羊就很日常啊，但是有时候总感觉高杨是淡淡的说或者做疯狂的事情的人所以～"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "高老板！高杨成立自己的工作室之后越来越独立，越来越自信，这个昵称也是高杨能力的象征吧。"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "私下没有其他乐高朋友)会和朋友说他表情管理很好,还掌管网线(高哥断我网不止一次了.))"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "为了见高杨，看看高杨最近都做出什么东西来了。（作为股东要定期检查投资公司的产品质量！）"}, {"q": "乐高觉得高杨最不想让新“乐高们”知道的“冷知识”是什么？", "a": "他不想让咱们知道的那可太多了，而且他不想让咱知道的事儿，咱好像没有知道的（bushi）"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "可能因为买的太多，硬塞给朋友们（比如有人到他家做客：那个别空着手走啊，送你几个地漏网）"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "希望我们都能成为更好的自己。你是自由的，我也是自由的，但我们依旧共同呼吸着同一片空气。"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "每次写信给我们的时候，像邻家大哥哥一样写出一些对于未来的期许和这段时间的感悟，看着心软软"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "继续向前吧，不管倒流到哪里我都还是会成为乐高成为他的观众的，还是向前吧，向前才能多见面。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "把灯神买下来，给我打一辈子工🤣\n平安健康☺️让我成为马斯克🫣让灯神给我打一辈子工🤗"}, {"q": "乐高最爱的“小剧场”的哪个主题：________", "a": "看高杨好好工作和好好生活,感觉在我为生活和学业忙碌的同一时刻他也在努力是一种很奇妙的感觉"}, {"q": "乐高们最喜欢你的哪句羊言羊语（名羊名言）？", "a": "理想为什么要实现它呢,实现它还是理想吗对吧 Q:那你理想放到那是干嘛的 🐑:就是想想啊"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "是工科专业🥲自动化\n羔子别来学工科……文化生的话学个哲学或者马克思主义理论也未尝不可啊"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "相机永远没有办法完全记录下现场所带来的震撼，为什么没有可以复制现场的幸福感的记录设备啊！"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "实体专辑都可以吧，也是需要好好考量的事情。古典小高什么时候上线呀，爵士民谣也可以尝试一下"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "rap…虽然蓝关雪体验了一下高哥的rap，，我们正经写一首吧，写一首没歌词没那么挤的……"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "Hhhhh如果没丢也快了吧 7年多8年 高哥每年在家呆50天 都差不多300-400个了"}, {"q": "乐高觉得高杨最不想让新“乐高们”知道的“冷知识”是什么？", "a": "学会购物后买了发光马桶盖\n不喜欢用手机壳，喜欢用这个裸身手机。因为不能辜负工程师心血。。。"}, {"q": "猜一猜高杨会说什么？看了19年“小剧场”那幅画之后，总是忍不住“跷二郎腿”，怎么办？", "a": "*眼睛眨巴眨巴眨巴\n“想翘就翘呗，我自己还翘呢。但是这个还是不要总翘，对身体还是不太好的”"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "我缺课了emmm，猜一个用完了吧，还可以送人，但是送人是ok的吗，但是为什么要买300个哇"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "心疼，但也欣慰\n以后山高海阔，路远且长，我希望我们不忘初心，慢慢一步步踏实的走到更远的地方"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "高哥辛苦了，记得多休息，注意身体，定期体检，好好吃饭，在这些的基础上再考虑音乐剧的事！！！"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《闲散的哲学》，哲学书，读后感悟就是……感觉高杨应该看看，这本书和他的思维碰撞应该会擦出火花"}, {"q": "在你印象里，乐高之间身上最统一、最明显的特质是什么？", "a": "大家都是一群特别美好的小女孩😭而且每次看高哥的剧都会被投喂很多很多物料大家太美好了太幸福了"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "羊只要萌萌笑我就感觉很治愈hhhhh。也很喜欢他说一些规划的时候，看起来很稳重，很有安全感。"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "谁来抬一个科幻题材音乐剧…\n表达价值观……大概就是要坚守内心。\n（我这个回答好离谱，我道歉）"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "1. 去那些辽阔的地方，去看世界各地的大山大河\n2. 去艺术氛围和历史传统浓重的世界各个地方"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "火星？反正应该是地外哈哈哈哈。地球上的地方我感觉只要想去都能去，地外就不好说了，所以机会难得"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "新疆、西藏，感觉能把我净化，但是其实是时间问题，在喜欢高杨的路上我已经一个人走了三十个城市了"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "18年\n我要告诉他你以后会有更多人喜欢，也一直坚持在自己的道路上。不用害怕，我们乐高一直都在"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "1.做音乐剧。\n2.一是世界和平且充满爱；二是大家都能看到自己，拥抱自己；三是平安健康长乐。"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "他真漂亮,我只会对着朋友一味地夸赞这个小高杨,脸嫩嫩的但是做的事情又感觉很成熟,救命好喜欢吧"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "每次看到高杨的萌图或者帅照,都会与其他朋友分享,如果是高杨的“糗事”,也会悄悄笑话(怕断网)"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "哥你出一个吧哥，我求你了。跪下😭流行，古典这种吧，但感觉如果是现在的话高哥会出rap+摇滚"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "我喜欢安静一点的长线条一点的音乐（嗯有点抽象但我只能描述成这样了）古典？或者流行？大概是这样"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "感动＞感谢＞感慨（？）\n对自己好一点，好好休息，好好吃饭，没事开开个音，不要像上半年这么忙了"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "感觉有点被世道逼得没招了，看淡一切，无为而治了（）\n一路走来辛苦了，请继续演下去和唱下去（）"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《月亮与六便士》\n与众不同的做法/想法，都只是他人眼中的看法，或许换个环境就不会“与众不同”了"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "风声，读后感悟是很精彩，非常非常想看剧（高哥你真的很适合演白小年！风声三轮请让我看到高小年！）"}, {"q": "在你印象里，乐高之间身上最统一、最明显的特质是什么？", "a": "活泼，开朗，可爱，细腻，高山与流水，很爱很爱🐏，也很懂很懂🐏，都是一群特别有品味的姐妹们～"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "狄公传？不管是正史德行或是野史判案都很有看点\n或者自深深处，很适合做独角戏，看看高哥一个人演完"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "乐高大王！掌管乐高的神对，每天就在家里拼一拼乐高然后放到展示柜里收藏起来，定期还要擦擦灰那种（"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "小羊！或者高哥\n小羊就很可爱啊！听上去就软绵绵圆滚滚的\n高哥就很靠谱，感觉特别适合特别好的老板"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "我妈妈这个新“乐高”倒是天天说高杨的小剧场,吃饭顿顿都在吃肉不吃青菜,容易不消化哈哈哈哈哈哈哈"}, {"q": "在你印象里，乐高之间身上最统一、最明显的特质是什么？", "a": "乐高们都很有想法，面对同样的事情有不同的看法，但是不同的想法又有相同的点就是希望高哥能开心自由～"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "印象很深的是签售之前高哥笑着看了我一眼，一瞬间就很平静，虽然依旧激动的语无伦次但是内心是很平静的"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "上海，因为我20年高考最想去的城市，想去看音乐剧，与我的家乡广西县城相比，我更喜欢繁华热闹的地方"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "哥哥，因为我是高杨梦女，且比他小，喜欢这么叫他（没觉得这个属性有什么不能说的！我也很爱他！🥺）"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "在，或不在\n看见，或看不见\n仿佛都能感受到流动的温暖\n时间飞快流逝\n但未来还长\n下一场，我们再见"}, {"q": "猜一猜高杨会说什么？看了19年“小剧场”那幅画之后，总是忍不住“跷二郎腿”，怎么办？", "a": "想让高哥录制一个语音提醒我别“跷二郎腿”或者给我念念“跷二郎腿”的危害，从内心本质上根治这个病。"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "太忙了根本在家都待不了太久吧，会不会其实已经扔掉了，但是应该没有被扔掉被堆在哪个角落了吧哈哈哈哈"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "没有。一年365天，高哥回家住的时间能超过100天吗…？空中飞羊咩的一声就开工了，保重羊体啊！！"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "杜甫，见证一个重要朝代的兴衰，并参与其中，重新感受一遍仅从课本和他们的诗歌里无法体现完全的那种感情"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "买票看剧，把高哥所有剧都拉来ip地演\n所有人身体健康，每一次都能抢好位好价票，高哥来我ip地演午场"}, {"q": "乐高们最喜欢你的哪句羊言羊语（名羊名言）？", "a": "很多时候并不是我们没有做,或者我们做不到,而是我们根本就没有想到,看不到,才会导致你错失了很多东西"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "觉得骄傲吧。觉得小羊就是一步步在走自己的路，不歪不斜。\n一句话：名为高杨的台灯从来都是我们的朋友。"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "蒲松龄。\n能写出这么多志怪小说的人脑子里究竟在想什么？很好奇。难道说他真的看到过什么“特别的东西”？"}, {"q": "在你印象里，乐高之间身上最统一、最明显的特质是什么？", "a": "爱羊！大家都很友好善良吧，每次去看剧遇到的大家都特别好啊。吃到好多大家美萌的物料们，然后也都很聊得来"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "新疆。«天鹅舞»写到第二幕，卡在女主落地新疆这里了。希望能去一趟新疆实地感觉一下，或许会有新的灵感。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "自己躺平，分一点给高杨做一部自己喜欢的戏\n1.世界和平\n2.爱的人都身体健康长命百岁\n3.给我点钱！"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "期待高哥的读后感，小剧场可以多整几期不同的素材，还有旅行美食地图，期待你能在巡演的过程中，劳逸结合～"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "啊……其实很难猜测高杨的想法，高杨对乐高的情感真的很深重，他真的很尊重每一位乐高，认真对待每一个，，"}, {"q": "猜一猜高哥在“阿姆斯特丹”海边到底立志一定要做到的事情是什么?", "a": "一定可以完成目标！完不成的话,就完不成吧。不过希望自己还是可以完成,不然就从这跳下去()(虚晃一枪)"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "高杨，你真的真的辛苦了。\n高杨，八周年以来你已经做的很好了，继续大胆又执着的走下去吧，我会一直在❤️"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "很开心认识你，很开心见证你的成长也见证我的成长，希望我能越来越成熟成为能抗事的大人，就像gyon一样"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "想看高智商刑侦悬疑（对 我就是没看上猎罪很难过😢）或者高哥自己写的书改编，什么都可以！高老板快动笔！"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "高杨会变成把乐高放进陈列柜的小孩。\n那你说我们变成乐高，会被拼成什么呢？我想做蓝关雪里的椅子，怎么样？"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "填表的时候还没出录取消息啊…不过想学天体物理或者天文哦（虽然没报），可能会去学电子or材料or计算机吧"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "哈哈哈哈哈哈哈哈哈可能用完了 也可能送出去了一部分   不过八年了 就是一周换一个  也差不多要用完了"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "虽然还未开始工作，但是我会想从事图书编辑，或者制作相关的工作。kpop专辑制作的各种概念设计让我很向往。"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "感谢每一次的相遇见面，只要见到高哥都会觉得幸福。\n（如果可以，希望能够早点认识羊，特别后悔入坑晚啊啊啊）"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "2025.8.3 江苏大剧院sd\n第一次看音乐剧，sd时给高杨递信并收到高考祝福，but没按开始 没录上"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "1.给他带薪休假去旅游\n2.学习声学，好想参加合唱团，可是我已经上班了hhhh\n3.投资开音综，吾湖团综"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "各种抽象言论＆事迹 such as 鲱鱼罐头,中专生(其实看了一下央音附中的录取率完全地狱中的地狱模式)"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "有点小骄傲也有点小心疼，高哥这一路走来太多不容易也太多挫折了。\n最想对高哥说的话是“留点时间给自己吧！”"}, {"q": "“鸟巢演唱会”是否纳入下一个5年计划？或者10年计划呢？", "a": "纳入！！！十年吧（感觉五年的话有点太烫了，想再看几年！！！）（不过也一样他可以得到越来越多的支持和认可）"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "把《雪拥蓝关》看了一下，感悟就是《蓝关雪》有点把嫂嫂的人物刻画太少了……就完全没有体现嫂嫂在这里的作用……"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "我其实都很期待诶。不知道是不是奇妙的信任，我很期待高杨的任何作品。你到底能做到哪一步呢，能做到哪种程度呢？"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "关于高哥家乡的故事，或许像我的阿勒泰那种？一个精巧的个体的故事 但同时又承载了这片地域上最广泛的情感和魅力"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "新闻传播，总之我想当文科生就算就业前景不好。要是没有被家人安排我真的会学文的，我离最初的梦想越来越远了……"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "臭羊、臭小羊 看到小羊一脸萌萌的干坏事 被发现还老大爷笑（这不是黑称啊！我家里人给我起的小名也有臭字🥲）"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "目前倒是还没有 特别中意的称呼  有时候叫高杨 有时候叫高哥  打字儿的时候叫gygg ，或许以后会有咩哥"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "没有\n2019-2026 七年时间，平均每年要用42个每月至少3个才能用完，已知高杨不怎么在家，所以没用完"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近嘛。。医学生期末周有感觉吗，，疯狂预习诊断病理病生药理。。。\n（不过其实不太爱看书我还是爱看美剧之类的）"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "题材我有点期待不是那么现实的题材，但不是科幻哈。价值观和作品符合就行，为了一个价值观讲故事的东西，那叫社论！"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "在该看到的时候就会出现叭！什么题材都可以只要价值观正确就好 喜剧和悲剧都有它所存在的意义和想要转达的观点😻"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "高哥可能会想回新疆待一阵\n我想去维也纳看看，看看高哥曾经生活过的地方，并且那里的艺术气息也很浓厚，去熏陶熏陶"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "很感谢乐高们这么用心的给我制作了这个“惊喜”礼物。谢谢你们，我爱你们。（高哥你直接给我们出个小剧场念完得了）"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《红楼梦》，经典名著了，每一次看都百感交集，所有人都是命运洪流中身不由己的一粒沙，我们如今有这样的生活如此珍贵"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "去到各个地方看🐑演出！\n愿望：希望高哥身体健康；希望高哥在自己热爱的道路上越走越远；希望能跟高哥合作嘿嘿嘿；"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "一个亿要买下音乐剧版权，给高杨猛猛投资！\n第一个愿望要许自己幸福顺遂，第二个许高杨一切顺利，第三个放灯神自由。"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "一只乐高积木羊\n（乐高是对高杨爱的集合体，但是我们高杨也很爱高杨，所以高杨也是乐高，那变成积木小羊就很合理啦）"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "乐高世界里的小人（大家聚在一起才造就了一个编织的美好的梦境世界 就像我们相遇在剧场一样 每个人都是不可或缺的）"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "羊（我和家人都这么称呼介绍\n因为和羊一样很可爱！羊在新疆很多，那里是他的家乡。高杨yang，谐音！\n以及自由！"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "各种风格都能接受，音乐类型只是载体，但很期待高哥出的音乐是自己想表达的，有自己风格，同时也能凸显自己嗓音优势的"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "跪求实体专辑，如果能亲签就更好了…（幻想中）\n摇滚！！高哥自认最不适合的类型，真的很想听听重金属羊是什么样子。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《雪拥蓝关》\n感觉高杨改编成音乐剧特别好，无论是借鉴过《雪拥蓝关》还是什么，特别好，很贴人物，希望高杨继续做下去"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "岩井俊二的情书\n叙事加爱情\n“我一面佯装平静，一面把卡片塞到口袋里，然而不凑巧，我喜欢的围裙，上下没有一个兜。”"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "他的穿搭,很好笑…比如一件造型一样的短袖有好多不同的颜色,…加上高杨的体态,总有种“老头衫沙滩裤”的感觉,dbq"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "声乐教育 高哥想在我这换个专业体验是不能够了我这学美声的一朝回到解放前（），当个文化生的话我可能会选汉语言文学吧"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "汉语言文学。来吧跟我一起痛苦的在文学的海洋里挣扎吧（以高哥的个性不会学到最后论文要写各大文学作品的戏剧化改编吧）"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "羊：感动的掉小珍珠中（就在害羞，所以捂住了脸）\n    “ 害～搞的很感动\n       我爱你们”，谢谢乐高们"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "感觉八年过去是更有深度思考的🐑 能让每一个角色都更有生命力也成为了剧场中央那个闪闪发光的自己\n谢谢你成为高杨！"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "想去新疆，地理距离太远和时间不够一直是阻碍🥲\n赛里木湖一直是我的梦中情湖，想去看看辽阔的原野，结识更多辽阔的灵魂"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "5.2本杰明返场的时候自己最后一个人在台上默默鞠躬看的人毛茸茸的心暖暖的！还有每次接礼物认真端详（）细心收好的样子！"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "其实看到他好好的，不那么累，做自己喜欢的事，就觉得很治愈，他好好的就好。高杨能成\"高杨\"，站在那里，对我来说就很治愈"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "或早或晚，78岁之前。\n想看表达观点的作品吧，或者能开发、引人深思的类型。\n价值观关于勇敢，关于纯粹，关于理想主义。"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "高杨。总有种喊他的名字就是在一次次看到那棵向着天光而上，向着土地扎根，向着世界伸出枝丫，与风雨、昼夜相遇相处的高杨。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "其实内核没变，还是很坚定，很清楚自己到底要什么，并为着自己想要的东西付出努力。\n想说：工作辛苦了，也不要忘记好好休息"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《简·爱》\n因为音乐剧版即将到来，故回顾了一下原著，相较于小时候有了更多感悟，更能体会那个时代中的简的抗争精神之可贵。"}, {"q": "猜一猜高杨会说什么？看了19年“小剧场”那幅画之后，总是忍不住“跷二郎腿”，怎么办？", "a": "高杨：“跷二郎腿， 跷二郎腿这个 这个 哈哈哈（高杨笑） 那就跷呗 那就跷吧哈哈哈（高杨可能手挡嘴笑） 我也跷我也跷”"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "感觉没有一个很明确的瞬间，就是看他一路走来，然后很多挫折经历了很多，走到现在，就觉得看到他我就觉得我还能在现生再努力一点"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "请高杨教我唱音乐剧\n1、见到高杨的时候不用花交通费\n2、跟高杨畅聊2小时（把一些想说的话说出来）\n3、跟高杨去一次游乐园"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "最新的就是已和朋友分享好几天外星人,谢谢高哥的直播成功让我脑子里全是外星人完全忘不掉,现在聊什么话题都要牵扯一下外星人了"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "唱片是一种浪漫，是抒情诗。这些音乐类型都想听听看，都是有趣的尝试，考虑到哄睡曲需求，更想听古典、摇滚、爵士、民谣、古风。"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "每一次谢幕时的鞠躬，每一次舞台上诚挚的神情，每一次返场时并未从角色中脱离的那几秒，以及聚光灯下完全融入戏中的他………………"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "最治愈的不是某个瞬间（毕竟没有签售过🥹），看着高杨一路走来，哪怕乘风破浪也能淡然微笑，走得越来越笃定、自信，就是最治愈的"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "蓝关雪签售...是第一次见高杨也是第一次签售，紧张的完全语无伦次，回去我一定不会忘了跟他说辛苦了要好好休息呜呜呜懊悔了好久"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "知识产权（法学）在读中。\n选哲学怎么样…我感觉我们学校哲学系挺自由的……\n或者是偏研究类的专业……（比如什么文物保护修复）"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "见到高杨这个人；享受一场精彩的演出；等待舞台灯光亮起的那一瞬间，独属于现场演出的仪式感；想看他在舞台上闪闪发光的样子………"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "工作慢慢越来越多了也越来越好了，真的有在好好的完成自己想做的事情。请你一定要健健康康平平安安的，为我们塑造一个又一个角色。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "1.把高哥拉过来在面前唱歌演剧（沉浸式羊羊小剧场）\n2.请灯神保佑高哥在舞台上演出顺利，身体健康\n   请灯神给高哥三个愿望"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "给高杨投资去做喜欢的剧！\n1.希望所有乐高们都能成为更好的自己\n2.希望高杨健健康康一直在台上绽放\n3.听高杨的放灯神自由！"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "太摇滚的我害怕，我喜欢听温和一点的歌。但是🐏想出啥出啥吧，毕竟每个人口味都不一样。呃或许可以出那种集合？啥风格都有的那种。"}, {"q": "“鸟巢演唱会”是否纳入下一个5年计划？或者10年计划呢？", "a": "当然了。但是去了鸟巢能不能看看大湾区哈哈哈哈，鸟巢好远哦。把燃油费打下来！来回400好贵！但是如果真的开鸟巢，我真的很期待哦"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近一次是高中了，东野圭吾的好多悬疑小说，嫌疑人x的献身（此时的我还没有意识到这些小说都能改编成音乐剧），写的太好了好看！！！"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "等到时机成熟的时候（但是我觉得快了按目前这个架势）想看新疆的故事 具体不知道但是肯定是对勇敢、自由、善良、真挚等美好事物的追求"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "已经看到高杨工作室出品的蓝关雪啦！如果是未来的话，想要看到现实题材的音乐剧，表达的主题内容是人在现实生活中究竟该如何和社会共处"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿就去收购高杨工作室，让高杨当我的员工给我赚钱！\n最想许的三个愿望：高杨唱到80岁，高杨一直平安健康顺利，高杨给我分红。"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "我是双学位双专业，视觉传达设计和产品设计。我觉得🐑可能会想学史论考古类？需要沉下心游离社会核心（科技）之外做的手头功夫专业？"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "可以在两个小时里，在剧场里不用有任何顾虑地欣赏一场演出，见想见的人（包括高杨也包括乐高）。每一次去线下见高杨都是一次盛大的仪式"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "好像不太分享,之前会和刚入坑的朋友聊早期小羊,以及学校倒闭的悲伤事情(但是！我再也不笑话你了gygg。今年我学院没了…拆分了…)"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "李白\n究竟是怎样的动机和祖国的大好风景\n让此人写出如此多的诗歌美景\n而且他的一生很跌宕起伏，在那个时代这样的人生会有怎样的感悟呢。"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "全职女儿（）\n不过我说实话我挺想把所有职业都体验一遍的感觉很有意思特别是那种广告设计之类的 每次看别的老师做的产出就觉得真的好牛啊"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "是高杨的话，能成长如斯也不奇怪，高杨就是天生做什么都会成功的！\n八周年快乐！一路走来辛苦啦！要坚持成为83岁德艺双馨的老艺术家噢！"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "很骄傲也很感激你成为这样一个高杨。\n好希望可以早一点认识你。不过没关系，日子还长长的。请幸福平安健康顺利呀，“前途无量 海阔天长”"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "1鳟鱼，毕竟是出道时刻，想看看年轻羊\n2sd，早早的拼命狂奔，跑到sd第一排，看他聊天解答问题。（疑似剧女跑不到第一排死前最后幻想）"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "（1）开一个音乐剧出品公司\n（2）拥有很多很多钱\n         高杨陪我去遍全世界上所有剧场\n         自动学会十国语言"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿我要把高杨包下来让他好好休息\n第一个愿望是让我当灯神，第二个愿望是希望所有人开心快乐，第三个愿望是所有人都可以再许无数个愿望"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "我喜欢叫他羊，就单字一个“羊”，感觉很萌啊哈哈哈。也喜欢叫他高哥，因为感觉他很厉害很稳重，是我想成为的那种大人，不无趣又很有能力👍"}, {"q": "猜一猜高哥在“阿姆斯特丹”海边到底立志一定要做到的事情是什么?", "a": "做出更多好剧,让音乐剧发扬光大,然后尽自己努力将更多的好故事搬到台上。他可能会说希望做出更多的剧,无愧于自己的专业也无愧于观众的期待"}, {"q": "在你印象里，乐高之间身上最统一、最明显的特质是什么？", "a": "有发现美，感知美的能力…\n（当然不止是因为我们gyon长的好看，而是大家每次都能发现高杨的用心，和他这个人有多好）\n还有大家的共情能力"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "7.15大家给他唱生日歌 他摘掉耳返笑着上看下看左看右看 看每个位置的粉丝们  眼睛亮亮的 。包括每次收下礼物、花、信 都会好好地带走"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "一直在燥候，希望能够做出非常具有中国本土特色的音乐剧（21世纪中国的剧院内还上演着上世纪甚至上上个世纪的外国故事本身就有一点悲哀😭）"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "依旧想看家国元素，国风或者二狗那种抗战题材都可以，感受到gygg很喜欢这类题材，我也很喜欢这类家国情怀或者能展现中国传统文化类型的剧目"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "先存一半钱生钱，再用剩下的去看高杨的剧，投资他\n第一个愿望是高杨平安喜乐越来越好，第二个愿望是能有机会跟他合作，第三个愿望是回到八年前"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿会想环游世界好好生活，然后顺便追线下，\n1️⃣希望我的家人朋友及喜欢的人平安喜乐2️⃣让灯神完成一个自己的心愿3️⃣放灯神自由"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "？（幻视如果我变成台灯你还会爱我吗☝）我们真成乐高了…羊…变成桌子吧。嗯对，就是乐高架子，展示我们的，呃也许叫展示台？不拼乐高不太清楚"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "白巧酒心糖🍬\n因为高哥外表像白色巧克力一样，细腻温柔，干净舒服，内里另有乾坤，醇厚微烈，内核充实，踏实沉稳；浅尝清甜，久品微醺绵长。"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "刘禹锡，我老乡，前度刘郎今又来那个劲太ENTP了，努力学习人生态度中。或者狄仁杰，其德昭昭，其志烈烈，如得尚方斩马剑加于君颈，虽死如归。"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "高杨唱歌的时候。2025年7月15日，高杨站在台上给台下的乐高们提前“检阅”新歌《美好的疑问》，那一刻所有的灯光都聚焦在他一个人的身上。"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "2020年年底或者是21年年初，那个时候我刚从广西去北京上大学，北京真是一座文化发展繁荣的城市，结束了高考特别想见到只能出现在手机上的人"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "入股高杨工作室。第一个愿望是希望高杨从此一帆风顺，第二个愿望没想好（因为不能贪心，这个愿望要留着发挥他的作用），第三个愿望就是放灯神自由"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "拥有一个亿我给高杨在北京建个剧院，免费租借给他演，这样他可以多来北京\n愿望1:高杨身体健康\n愿望2:高杨心想事成\n愿望3:高杨做我男朋友"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "很敬佩你对艺术对理想的志气，和一步步实现这些理想的勇气。你说天青是一个有少年心气的人，但你本人其实也是。无论路途如何，相信会有好的结果。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "给高杨当出品人投音乐剧（）或者成立某个病种的基金会吧\n希望我认识的所有人都健康平安快乐吧 希望祖国医疗卫生事业好好发展 最后一个放灯神自由"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "每一个角色，每一次演出，都有不同感觉，加以各地的特色，让舞台上鲜活的高杨多了一分趣味，也让我们见证了高杨在舞台上的光芒和他眼里的细碎星光。"}, {"q": "猜一猜高杨会说什么？看了19年“小剧场”那幅画之后，总是忍不住“跷二郎腿”，怎么办？", "a": "gyon：跷二郎腿…？想跷就跷吧，跷一跷多舒服。（切换神色）不过这个话又说回来……这个不利于身体健康的活动还是尽可能少做……（后接大爷笑）"}, {"q": "“鸟巢演唱会”是否纳入下一个5年计划？或者10年计划呢？", "a": "在你感到幸福的前提下大胆去做吧，我相信你想实现的在你的努力下总有一天会实现，高杨老师。或许将来的途径点不是鸟巢，但是我相信你还会越来越好的！"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "第一反应可能是新疆…不过新疆这属于回家吧…不算旅游。\n其实挺希望高杨哥去海边看看的，大海是与天地不同的另一种辽阔，不同的风景也会有不同的感悟。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《摆渡人》一本小说\n我第一本看的是摆渡人3，我看到了很纯粹的故事，所以才补了1和2。我喜欢他们离奇的世界观，和我们世界也许有些背道而驰的死亡记忆。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《每个冬天的句号都是春暖花开》\n没一个寒冷萧瑟的冬天走到尽头时，都会迎来温暖花开的春天。人生中所有熬过的苦难与低谷，最终都会化作新生的力量与希望。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "本杰明原著😭真的特别特别好看 完全收获了无论你所拥有的是怎样的人生起点 你都收获了与众不同的生命力和你所成为你的理由 去用尽全力的热爱自己和世界"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "长大啦，你的这份成熟一定上也影响了我的性格\n祝能够你做你想做的，早日成为德艺双馨老艺术家，遇见你我好幸福，谢谢你，也谢谢因为你认识了很好的乐高朋友"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "牛虻，很适合改编音乐剧啊！亚瑟伪装成瘸腿杀子的朝圣者见到蒙特里尼，深夜教堂内聆听到蒙特里尼的痛苦，绮达指出亚瑟对蒙特里尼的关注与爱，都很有戏剧张力。"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "如果“乐高”真的是乐高，高杨就是千变万化的乐高成品！因为高杨的存在，才有了乐高，每一个乐高都是独一无二的，但由于高杨我们聚到了一起，有了具体的形状。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "最想去全世界采风，做新时代的马可·波罗。想许：有一个基金支持孵化各类文化项目（书籍、绘画、音乐、影视、剧目等等）；会世界主流的几种语言；再来两个愿望。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "一个亿的话，当然是投资 高杨工作室，和高杨一起赚下一个亿！\n第一个是希望我爱的人和爱我的人往后余生平安喜乐，第二个是再给我两个愿望，第三个是放灯神自由"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "根据百度百科，地漏主体使用寿命在十年以上，但里面的防臭芯根据材质不同寿命在一到五年不等，一般房屋需要安装的地漏数量在四到五个，因此：合理推断，还没用完"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "是杀死一只知更鸟 讲关于种族平等，法律公平和教育的 很清晰的记得一句话，那些明知道会失败的事情依然选择去做，这是真正的勇敢。我们总是失败，但是偶尔会赢。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "德米安，存在主义？成长小说？了解了探寻自我的意义和重要性，“鸟要挣脱出壳。蛋就是世界。人要诞于世上，就得摧毁这个世界。鸟飞向神。神的名字叫阿布拉克萨斯。”"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "笑起来就很治愈啊，有时候就算心情不太好，看到高哥的笑也会觉得没什么是过不去的，可能是高哥的笑里总有一种释怀的劲儿吧，能让人感觉到一种“没什么大不了”的力量"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "其实我对于旅游没那么向往，因为我对风景啥的没什么兴趣。说的封建迷信点，我五行喜金土，对木水并不感冒。我更愿意跑上海去天天看剧，但是这称不上旅游吧哈哈哈哈哈"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "我想回到18、19年去见见22岁的高杨，因为是新粉来的，没见过嫩嫩的小羔羊～而且想去告诉他一定要坚持下来，你未来会是个很不错的音乐剧演员、制作人和出品人。"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "因为你的治愈能力，虽说起初是被你的脸吸引来的，但是看到你在舞台上“尽情狂欢”的样子，超级有感染力。能帮助打工人很好的充电，更加有勇气开心的面对现实生活❤️"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "不知道说什么，但是突然想到几句歌词：\n人生中最美的珍藏，正是那些往日时光\n……\n如今我们变了模样，为了生活天天奔忙\n但是只要想起往日时光，你的眼睛就会发亮"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "1月底宁波长腿的初次见面。想要再一次仔仔细细地看看他的眼睛，然后再跟他讲一次，“祝你今年更加幸福快乐，祝你年年都顺风顺水顺财神，祝你吃好喝好睡好什么都好”。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "啊好像好久没有读过一本正经书了，都是看网络小说居多。最近看的一篇是有关女性力量觉醒的，看完热泪盈眶的。女性一定要自强自立，站起来站出来我们的力量才能生生不息。"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "三国刘备。不要讨伐东吴，不要有夷陵的大火，季汉的能人志士不会一下子损失这么多，不会到了后期掏不出来太多匹敌的将领谋士，诸葛亮的负担会少很多，不至于晚期过劳死。"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "说不清楚是否是一个很确定的瞬间，只记得成为我的“白月光”的瞬间是《她真漂亮》，之后的八年时间里，开心的时候看到高杨会更开心，心情不好的时候，见到高杨心情会变好"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "首先会想这一个亿怎么来的，到我手上实打实一个亿吗，税前一个亿还是税后……（？）\n第一个愿望希望高杨平安顺遂，第二个愿望希望高杨天天开心，第三个愿望是放灯神自由"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近读的一本书是齐思钧的《喂，你好吗》\n讲的是小齐在心理方面的一些经历和感悟\n这段时间现生压力有点大，时常拿这本书翻一翻，有时候能缓解一下，大家都要好好的爱自己"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "编剧？演员？拥有一家属于自己的店，无论是咖啡店、花店、面包店，还是便利店、玩具店、宠物店，总之就是能让人感受到幸福的小店......果然工作的尽头是想自己做老板"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "全心全意搞艺术，从乐队到原创，从音乐剧到京话剧，在舞台上燃烧直到生命的最后一刻，用艺术点亮一片星空，用观点和影响力去改变这个世界哪怕只是一点，留下自己来过的痕迹"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿，拿一部分投资吧，可能就什么都涉及一点，还可以投资高杨工作室，成为真正的股东！！然后再拿一部分去做社会福利\n高杨身体健康发大财，高杨变成灯神，放灯神自由"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "高哥\n亲切呀，喊起来很舒服，也很符合高哥给我的感觉吧，像哥哥一样，在我开心的时候能放大我的快乐，在我低落的时候也能轻轻化开我的坏情绪，让人觉得很踏实，很有安全感"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近在读《雪拥蓝关》，因为是电子书，一开始对书的篇幅其实没有很真切的概念，直到开始阅读才发现这本书的内容很多，篇幅也不短，对还没有看到的《蓝关雪》也有了更多的期待"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "我喜欢看他给乐高写的信哈哈哈哈哈哈\n还有一次去看本杰明的时候 他车到了快走了 但我物料和信还没递出去就喊了他一声 然后他回头接过去了我现在回想起来还是觉得很幸福呀"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "云南吗？听说是打工人的精神疗愈之地呢。我这些回答是不是班味太重了，没办法因为我真的刚下班哦。不过其实我很想找个安静的舒适的地方一直躲起来哦，谁也不见，谁也找不到我。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "就走到现在真的真的很不容易，吃的苦挨的骂都看在眼里。其实也不怎么会说话，希望以后还能越来越好吧。\n请高杨继续走下去吧，迎接你的会是无数鲜花和掌声，乐高们也一直都在。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《宿命》悬疑推理 \n一直有听到关于宿命论的讨论，我其实相信又不相信，但这不重要。我更看重专注于当下，看重当下的感觉和判断去做出决定，那么以后的事情发生了我便不会后悔。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "读的是《明清戏曲和园林文化》，应该算文化题材？其实还没读完，只是一直对我们的园林文化感兴趣，同时对戏曲也有一定的好奇，看了一部分觉得或许戏曲题材的音乐剧舞美大有可为。"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "25.1.1的兰心长腿吧，前几年都不太看音乐剧了，只是单纯在关注srrx的朋友们。那次去上海，随便收了张票结果座位号还是自己的生日，剧也让我很共鸣，火速回归yyj。。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "一个亿：投资高哥的演出事业（顺便多点钱还能找个环境更好的剧院），剩下的乐高们分分吧，都去买票\n愿望：①高杨和乐高都幸福平安开心顺利\n②抢票顺利，观剧愉快\n③要一堆钱。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "感觉高哥一直在带着我长大\n高哥特别好！从声时期的青涩到现在已逐渐成熟，你二的这十年真的是很理想的十年了，希望我二了这十年最后也可以和你一样，成为一个有能力独当一面的人"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "回到2019年第一次看长腿的时候。那个时候我还没成年，去看音乐剧也得让家人陪着。如果那个时候我是一个有经济能力的人，我会毫不犹豫的多买几场，在谢幕的时候用力的给高哥鼓掌。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "如果有一个亿当然是辞职了（哈哈哈哈哈哈\n如果能许愿，1.我希望我们能永远幸福2.我真的很希望有一个亿3.第三个愿望…其实我也没有别的愿望了。那我也像高杨一样，让灯神自由吧"}, {"q": "如果“乐高”们真的变成乐高，那高杨会变成什么？", "a": "乐高们会变成建筑还是小人……？如果是建筑的话高杨还是高杨，高杨会把“乐高”拼起来然后保存好吧。。如果变成乐高小人，那高杨也变成乐高小人吧，一起生活，话说乐高的板凳会很硌人吧"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "如果有一个亿： 我决定跟巡 如果可以的话砸钱让自己也演一次音乐剧哈哈哈哈哈哈哈\n三个愿望：成为音乐剧演员、能跟高杨合唱发布一首歌、再有三个愿望（都许愿了 那就异想天开一点吧）"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "题材：戏曲与音乐剧结合（所以《蓝关雪》真的狠狠戳中我！）\n价值观：民族就是世界的，让更多人喜欢上民族的音乐才能让它们传承，让它们永存。这确实可能可以发展成中国音乐剧的独特特色。"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "不知道什么时候但我相信总有一天。其实我有点想看惩治霸凌尤其是隐形霸凌的题材（这大概不能演但让我幻想一下），价值观：黑恶势力终将死去，正义迟早会到来，世界要充满爱，阳光普照大地。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿的话 一部分拿去理财钱生钱 一部分拿来投资高哥新剧 再一部分给自己和家人朋友用嘻嘻\n\n1.让我没有灯神也能实现愿望\n2.让我爱的人和爱我的人都得偿所愿\n3.送我一千亿。"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "你将爱与希望投射到角色中，坐在剧场中，最幸福的瞬间莫过于举起望远镜那一秒，视野中你被无限放大，流露出的爱顺着舞台的灯光传到我们眼中，那种感觉或许是幸福，而追求幸福便是人类的本能"}, {"q": "高杨老师有没有计划出“实体专辑”唱片呢？最想听高哥的音乐类型？（古典、流行、电子、摇滚、R&amp;B、Rap、爵士、民谣、国风 / 古风等）", "a": "如果出实体专辑请精心设计🙏小期待一下摇滚，会很有反差感，可以先在个音上尝试啊！流行、R&B也想要。rap就尝试旋律说唱和爵士说唱，boom bap的话我自有人选（bushi）"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "想开一间花店，我觉得开花店可以帮助很多人传递他们想传递的情感，远在他乡的孩子想在母亲节送给母亲的花束，或者就像平常我们送给高哥的花束，当每一束花准备好，它们身上就已经寄托上的情感。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "希望高杨永远是高杨 永远是最纯净的开心的小羊 \n变成熟的心境是心疼，因为我一直觉得人总要听过看过或者是亲身经历过许多困境或者是不顺利的事，才会逐渐成长起来，这样看来好像更偏向于后者"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "希望就在不远的将来。\n什么题材都想看，但最想看高哥演反派，长了一张这样的脸，有一把这样的好嗓子就应该演反派啊！！！\n表达的价值观不需要特别固定，毕竟无论什么剧，大家的解法都是不一样的。"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "执念吗？以前的执念是想在最爱他的时候，和他共创更多属于我们的回忆。高杨从来不是容器，高杨就是高杨，是那棵在我的精神世界里深深扎根的杨树。但现在，执念是害怕见不到这个角色下不一样的高杨。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "林奕华《有一种旋律叫梁祝》\n讲述导演为何会创造出《梁祝的继承者们》这样一部戏，以及剧本\n浪漫的人大多容易伤感，早慧的人往往多思，在回答“我是谁”这样一个问题上，谁能真的说清楚“我是谁”呢"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "没怎么起过吧，喜欢和朋友喊叽歪\n觉得很可爱很搞笑\n不确定是不是方言，就是觉得一个人说话很多或者很唠叨的时候就会说，你别瞎叽歪，就觉得喊叽歪有一种看上去就话很多很好玩很邪恶羊粒绒的那种感觉"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "如果我有一个亿啊，我能不能先把声一那一帮人聚起来演一场（我现在想到有一个亿就想起高哥那一句如果有一个亿就有一个亿该有的责任哈哈哈哈）\n三个愿望，我所在意的人身体健康幸福快乐，世界和平，人人平等"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "如果我有一个亿，我想投资高杨的音乐剧，全国巡演！！！\n如果我有一个可以许愿的“灯神”，我最想许的三个愿望是：\n1.高杨身体健康，平安顺遂；\n2.戏剧之神永远保佑高杨；\n3.一直能和高杨剧场见。"}, {"q": "乐高们写下你的大学专业（中学生及以下理想大学专业）（🐑：如果当“文化生”大学想选什么专业？）", "a": "我是新闻学的…未来可能分流到体育新闻…其实我对体育没什么兴趣，但是报志愿时候综合考虑下来还是选择了相对轻松的学校和专业（重生之我在体院学新闻）\n\n羊你学哲学吧哈哈哈哈哈哈哈。话说羊会当理科生吗？"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "我想去离山东远一点的省份，但不要出国。我喜欢中国，它给予我安全感。离开山东又给了我陌生感和新鲜感。我想看黄果树瀑布，想看看传说中的喀斯特地貌的实景，想看看西边的高原和雪山，想看看北边寒冷的冬天……"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "对我来说有两个吧，一个是作为演员在舞台上谢幕的时候，展现完专业性后的这种感觉很仪式感（？就是特别喜欢这种时刻。第二个就是被此羊看的时候，一颦一笑都扣动心弦。笑眯眯的眼睛看着你完全温柔乡来的，特别美好治愈"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "在不损害羊体的情况下越早越好！想看自传（原因是之前有一场直播，杨说非常想拍有关的新疆的音乐剧，比如讲一讲馕啊或者是怎样，然后在今年新疆的见面会中主持人问如果用一种新疆美食来形容自己会是什么 羊的回答是馕"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿就环球旅行，顺便看完所有想看的剧，并且投资高杨工作室，让老板自己写自己导自己演喜欢的剧，场场给我留票！\n向灯神许愿：一愿家人朋友一辈子平安健康幸福美满，二愿我能带着记忆回到18年，三愿灯神自由。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "如果我有一个亿，我要给自己办个生日会，请高杨来演出，免费给乐高们邀请函😋如果有一个灯神，我第一个愿望绝对是拥有十个亿，第二个愿望可能是顺利地一直读书拥有n个硕n个博，第三个愿望是自己在意的人都健康如意"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿就放在钱包里利滚利！还要给小羊投资，我们发达了小羊必须跟上！！\n第一个愿望是希望世界和平，不要再有战争\n第二个愿望是家人身体康健，安度时间\n第三个愿望是高杨身体健康，做干净的纯粹的自己喜欢的一切。"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "应该先让羊数一数300个地漏是不是真的300个！我刷到很多像卖垃圾袋啊棉签啊保鲜膜啊这种大量生活用品的，商家缺斤少两！💢\n\n好的回答问题，我觉得用完了。哈哈哈哈哈哈哈，这么多年了这种消耗品应该用的很快吧"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "19年底第一次看《长腿叔叔》的时候，抽签售只有一排之差，当时应该收一个签售资格，然后亲口对高杨说：“你是好棒的音乐剧演员，未来你会成为更棒的、最棒的音乐剧演员，你还会做制作人、出品人，在这个行业闪闪发光！”"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "直播或者访谈聊自己对职业对音乐剧对人生的理解的时候，很多地方非常启发我。特别是因为自己初入职场受到了很多预想之外的不如意，不知道如何开启自己想要的事业，不知如何平衡理想与现实，他给了我很多面对逆境的勇气和力量"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "没什么执念，第一次看音乐剧是高🐏场，被他的声音和各种小动作萌到，之后再看音乐剧会优先选择有羊的场hhhh。我目前还穷穷的所以也不会特地为了羊去看演出，就是优先吧，毕竟看过一次之后觉得不错。在我心里给个夯👍"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "其实喜欢高哥挺久了，但之前都处于一个没办法经常去剧的状态。所以错过了很多之前的角色不会复排，觉得很遗憾。所以现在尽量每一个角色都去看一场是为了自己不留遗憾吧，也是能看到不同戏中角色的不同状态多看一看总归是好的"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "希望是在他做好一定程度的准备之后。至于题材，都想看，开盲盒也是一种快乐，非得选的话，或许是成长类吧？希望看到的价值观，也会偏向于“每个人都有自己的光，有无限可能，多看看自己，多爱爱自己，你是你，你多美好”这一类。"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "最想穿越到樊於期身上，回溯到他献出自己的头颅前，告诉荆轲，就算此去风萧萧兮易水寒，就算这或许是必然无用的挣扎与牺牲，但樊於期不会怪荆轲，这不是白死，这是两位壮士对自己的生命遗憾但最响亮的绝唱，壮士只管向前，无需回头"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "编剧、音乐人或者手作人。怎说呢，其实即使现在每天被工作压着打，但是我依旧在摸鱼写本写歌或者做手工。或许当爱好成为职业之后，我会有新的想从事的职业，但是我还是想看看把喜欢的事变成实现理想的路，到底能看到怎么样的风景。"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "和高杨相遇的这八年来，我觉得我和他都走在人生高速发展的进程中，他在越来越好，我也在自己的人生课题上不断地成长。希望高哥可以继续演更多作品，解锁更多新的身份，同时也要注意身体健康~我在努力赚钱啦，争取以后更多的见面！"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "等会穿越我懂，时空回溯是什么？这个问题太宏大了，我的历史知识也并不充足……我一直觉得自己是渺小尘埃中的一粒，真穿越到伟人身上我是会吓死的……那我穿越成秦始皇让他别吃水银了吧，活得久一点，能统治世界更好了，我不想学英语。"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "最想看的当然是我们中国原创yyj！相信我们的高总一定能做出属于我们中国自己的音乐剧\n价值观上想看到传统与现代的碰撞（这个是老生常谈了）、中华文化与思维的现代化表达、关于爱的定义与思考、生命的自我和解、接受平凡但不甘于平凡"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "声入人心。那时三年级的我看完了整季，可是对节目的人都没有细细去看。直到后来2024年想起回看才算是真正触摸到那个冬天的光，再然后......就是掉进音乐剧这个大米缸。呃呃说偏了，总之就是……如果能早一点认识高杨该多好啊。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "1．先存银行吃利息，一部分看剧一部分环游世界一部分做公益，再来一部分把自己想学但没时间学的全学了，存一部分养老用\n\n2．希望世界和平\n希望所爱之人身体健康年年常相伴\n希望你我灵魂自由洒脱且轻盈，不困于某地，\n不拘束于某事"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "等高哥忙完已有的作品，这也需要一个契机吧，希望在那个时候不要被任何东西裹挟着去做高杨真正想做的东西。想看和本杰明那种的题材！带着轻盈缥缈的梦与爱与成长的故事，能够在忙碌的生活中为灵魂增添能量与爱，带来一些思考却不至于沉重。"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "我为什么第一反应是亚里士多德……拥有完整自由的求知人生，既仰望抽象真理，又脚踏实地观察现实；既有思辨的深度，又保有温和审慎的处世态度。\n思路正常一点来讲可能是徐霞客， 一生忠于内心志向，不受功名束缚，探寻山河间，实现纯粹自由的人生。"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "我觉得做剧也不一定要有深度，我们也可以做一个短时间的剧，不用那么长，然后演员啊观众啊大家开心就好了！\n我也希望他可以做出来表达:人生有时候被迫进行选择，你此刻只能向前走，可能结果不尽如人意，但我们要接纳，选错这一次不可怕，边向前走边修正嘛"}, {"q": "在你印象里，乐高之间身上最统一、最明显的特质是什么？", "a": "温暖，善良。第一次看音乐剧就是高杨的，那一次认识了很多朋友，甚至不止那一次，每次看高杨的剧都像是聚会，大家都很好很好。像我身边一些因为看他音乐剧而结识的朋友，到现在也是很好的朋友，尽管不怎么见面，有事大家都会互相帮助，然后一起期待下一次见面"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "1️⃣一个亿：买好多适合高哥的IP去学习做制作人和出品人还有编剧，让高哥给我打工🤔\n2️⃣灯神：\n愿望①希望高哥和乐高们都身体健康、无病无灾\n愿望②希望中国音乐剧未来越来越光明\n愿望③希望高老板早日实现拥有属于自己的剧的梦，完成自己自编自导自演自制的剧"}, {"q": "你私下会与其他乐高或者朋友分享什么关于“高杨”的“小八卦”?", "a": "其实这是一个我一直没说出去啊啊啊啊啊 悄咪咪 高哥过完年的肚子 到底是什么手感 哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "乐高们简直是真诚美丽大方，世间的所有虚伪都自动黯然消散，真心太稀有简直是全世界限量版，温柔又坦荡，干净又赤诚，越了解越沦陷，真诚的不像话，治愈所有不开心。（省略彩虹屁中……没有说让高哥搞抽象的意思嘿嘿，如果在这真的再写太肉麻我真的要哭了……）"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "其实我想看有文艺片哎，就是类似本杰明那类的剧，会探讨一些人生哲理。\n价值观倒不一定要硬上文化高度，平淡却有深度的故事也很好。高哥之前不是说想弄自传吗？我觉得像本杰明一样从小演到老也行，然后用唱诗班做旁白，舞美辅佐时间推进就好，应该会挺有意思的。"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "第一次见面吧，自己用五年才走到他的面前，我也怀念那时候勇敢的自己，但是如今我依旧勇敢。而且那时候真的是“圆梦”时刻，给我带来的力量是无限的，但是每次的见面都值得我珍藏，所以可以回到过去哪一次都行。也可以不回去，因为未来也值得我期待，不必停留在过去"}, {"q": "猜一猜高哥2019年“双十一”买的300个地漏网用完了吗？", "a": "由于高哥头发短假设每两周换一次，2019年到现在一共有约390个星期，假设高哥每年有50%的时间在家，则使用地漏数量应为390*50%*50%=97.5。不计入其他损耗的情况下，应该用了三分之一左右。（当然我不太清楚高哥家里有几个地漏哈哈哈哈哈）"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "声入人心结束之后刚刚开始长腿演出的时候。想再看看舞台上的你有没有不开心，有没有对于踏入这个行业的无奈与恐慌，应该是有的吧。这段记忆并不美好，可我还是想回到这个时候，虽然没有办法直接给你拥抱，但是还是想坐在剧场里悄悄地说一句，“高杨，你真的特别棒”。"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "欸…这个我真想不到该怎么写…\n总之我想说的只有感谢吧\n感谢高杨给我们带来的一切\n这当然包括我遇到的乐高老师们\n大家都是很好的人啊…\n感谢参与漂流手帐活动的你们\n让我知道，同行的路上还有这么多你我。\n八年…十年…二十年…未来的日子都是属于高杨和乐高的"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "其实一路走来感觉没有很大变化，但是突然去看八年前声时期会猛然发现高哥真的长大了，当时还是男大的青涩，现在已经是一个非常成熟的大人了，想起来这个就会有点想哭，我们都在慢慢长大。\n八周年快乐高哥，还是那句话，感恩遇见，感谢并肩，爱你，很多很多，很久很久"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "第一次去外地看高杨是去的杭州，因为那里有我的好朋友，也有美好的长腿叔叔，紧接着下一周又去了长沙，因为那是高杨出现在我生命里的地方，我想看到带着作品回到梦想开始的地方，渐渐的，想要去实现那一句“剧场见”，开始奔赴不同的城市，去享受高杨带来的美好和幸福。"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "我内心满是动容。我们这群乐高，本是散落在各处的陌生人，因为同一个人相聚在一起。岁月漂流，有人来了，有人离开，但彼此陪伴的温暖永远留存。我们一同奔赴剧场，共守长夜，互相慰藉。这段双向奔赴的缘分格外珍贵。往后的旅途，我们继续结伴同行，守住热爱，岁岁相伴。"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "关于我的执念其实只是想见一面，看看最近怎么样了，以及我也想看看他所带来的作品。以及和t奔赴各个城市，我可以和在各个城市认识的朋友们见面，因为 p和一些别的缘故，可能一年一年半才能入沪一次，也要一年一年半才能和朋友见面，其实只是想见见。和他，和我的朋友们"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿：五千万投资高杨工作室、公司，从精神股东晋级实质股东；上海、北京各买套房，银行定期存款，享受戏剧人生😋\n三个愿望：1.再给我一个亿；2.高杨工作室做大做强，有一队精兵强将，制作出品更多优秀戏剧；3.没了，让灯神入职工作室吧，自不自由的，先来上班。"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "「月亮河」\n月融了 滴在我臉上 淹沒我的悲傷 幾兩\n你來了 沾瀑了星光 往永恆的水上 凝望\n黑暗的另一端 是月亮 是我\n\n八载时光空悠悠，今夕月色清凌凌。\n白杨挺立傲寒风，高山不变乐自怡。\n锈迹不曾染冰心，玉壶环圆护身直。\n愿君岁岁俱安康，望卿年年喜吉祥。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近一次读的书是《你当像鸟飞往你的山》，是一本小说，主角是十七岁前都未踏入教室的大山女孩，却一步步成为了顶级院校的历史博士，最初的她怯懦、自我怀疑，直至她逃离了大山打开了新世界……这本书告诉我，生命有无限可能，哪怕怯懦担忧，也要不断学习，走向无限可能的未来。"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "很多次我都在高杨身上汲取到了力量，不断的告诉我，我可以的，如果是一瞬间，那我现在想起的是3.21重庆长腿叔叔签售的时候，因为第二天是我的生日，就想让高杨唱一段前途无量作为生日礼物，唱完之后，高杨对我说：“加油，你还年轻”，是啊，我们还年轻，我们都会前途无量！"}, {"q": "如果暂时忘掉现在的工作和背负的责任，有钱、时间和精力的情况下，最想去哪里旅游呢？", "a": "欧洲，自驾穿过一个又一个国家，从克罗地亚的波涛一路看到挪威的极光，在每一个感兴趣的城市或乡村住上一段时间，感受那里的节奏与旋律，沉浸在不同的文化叙述中\n或者踏遍中华大地，看看生养我的这片土地上的大好河山，尽量在我短暂的生命中在尽可能多的土地上留下我的足迹与感受"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "好几本一起在读：\n《激荡三百年》《把自己作为方法》《中国宏观经济二十五讲》\n有讲魏晋历史的，有讲怎么做人类学研究和观察的，也有讲怎么理解中国经济发展和数据解读的。好像把自己置于这种宏观的大尺度的叙事当中，就不会困于日常的琐碎烦恼，容易把心放宽，理解自己的行为和生活"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "秋瑾。她投身革命，她倡导男女平等，反对封建礼教糟粕，她写下《敬告中国二万万女同胞》。每一个曾经为我争取权益的人都值得铭记，不论她的历史评价怎样，毕竟对我好的人在我这里就是好人，更何况她的历史评价是好的。我想回去见见她，我想知道她怎样成为这样一个勇敢的有智慧的女性。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "1️⃣正在读《雪拥蓝关》，还没读完，喜欢天青的纯粹与热血，樱草的童真；\n2️⃣《奇奇怪怪也有人爱》，漫画，主角是一只喜欢“奇思妙想”聪明的小🐏，波德莱尔在“四季”变换中，被自己和身边的朋友治愈的故事。希望所有都可以做“任意形状的星星⭐”，不必拘泥于条条框框的规则。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "这八年高哥的成长和我的个人成长是同步推进的，但我个人看来高哥还远不是“成熟”，就算他学会了与世俗的利益论共处，但那个就算会被一剪没、也要坚定的站在台上唱古典的少年依旧鲜活，从未离去\n对高杨八周年我想说，尽管去做你所爱的事，我永远会相信那颗如赛里木湖般的心所看见的世界"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "亲爱的高杨老师：或许我不会一直在这条路上陪你，但是总有人在，我也会一直记得这段美好的日子，我因为看你的音乐剧感到很幸福，我认识了一些朋友，我感受到了很多爱，当下我的爱是真心的，我得到的幸福是真实的，期待考完研能在别的城市看你的剧！祝愿高杨老师再幸运一点，再顺利一点吧！"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《银河铁道之夜》\n因为到2025年才开始看剧，所以很遗憾错过了很多。对于将要看的和很遗憾没能看上的剧，我都会选择去看一看原著。看完《银河铁道之夜》真的很喜欢它梦幻的色彩，生命的意义生命的长度都是值得细细去想的。非常、非常希望可以在剧场欣赏高杨演这部剧啊（虽然好像很困难了吧"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近在读高中课本（手动狗头），最近的课外书的话是科幻世界\n三年读了几百篇科幻小说，从中国科幻到世界科幻，我个人最大的感悟是，从丝路朋克到星际航行，不管科幻背景怎样变化，不变的是对人性的讨论，是对爱的各种形态与各种滋味的理解与品味，而这，正是我们生命永恒的思考中亘古不变的议题"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "还没工作，关于未来我不知所措。我真的很害怕步入社会跟人打交道啊啊啊啊，想一直在学校啊……如果真的有足够经济基础就好了😭，那我没有想去干的工作，就躺平，看看书看看剧旅旅游，偶尔对某些事物感兴趣就去研究琢磨，反正有钱有闲，不比为了生活天天奔忙，心血来潮想学啥学啥，应该挺幸福的。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "八年了啊………对于变化的话，其实在意料之内，但这一路走来的故事里，我其实更想感谢高杨。感谢高杨成为高杨，在见证他的故事时，也让我一步一步成长，或许这也算是一种引领，他不止走了他的路，他为行业也扩宽了这条路，也为喜欢他的人找到了人生的路。\n最想对他说的一句话：今夜想对你说，前途无量。"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "我们和高杨之间有一条线，一条电线（这什么东西）。我们可以通过这条线达成一致，做出能让高杨更好的选择。有时候，羊会切断这根线将痛苦与迷茫藏进心底，我们不知道，但当他很轻松讲起那段往事时我们只恨我们在那个时候没有陪他。但路还长，我们的故事不会结尾，我们每个人都会有一个更加光明，璀璨的结局"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "对你的成熟变化，一遍在感叹你真的一步步成为了更好的样子，在坚定的做着自己想做的事，承担起了更大的责任，真的越来越好了。但是转念一想，又很心疼，特别是看你对弟弟妹妹们的样子，总是想，当时的你也能遇到现在的高杨该多好。对于八周年，最想对你说，高杨，做你想做的吧，乐高永远是你最忠实的观众！"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "很高兴认识这么多好的乐高老师们，大家一直都互帮互助也一直热爱着高杨和中国音乐剧，在在我看剧的日子里认识了我最好的朋友也感受到大家的热心和善良也很高兴和大家一起为高杨八周年做联产也希望乐高们在之后的看剧日子中有更多的票，大家可以一起看着高杨在之后的日子里演出更多优秀的角色在自己的生活中也事事顺心"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "很感慨，八年挺长的，看到高杨从青涩到现在越来越老干部，就是特别感慨。包括现在看着高杨一步一步到出品人制作人，觉得真的很厉害，有在推进这个行业发展。从一开始看到高杨工作室，到高杨工作室出品到现在，高杨有在更好地成为“高杨”。\n最想说的话，“无论如何我都会支持你，不是理所当然的那种，是相信的那种”"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿的话，最想的首先是拿一半出来投资高杨工作室，振兴中国音乐剧（哈哈），然后剩下的一半用来让自己和爱的人过想要的生活，追一追自己的小梦想\n三个愿望的话，第一个我希望我和我爱的都可以幸福健康，第二个我希望所有人可以不用面对那么多带着偏见的目光，都可以成为所爱的自己，最后一个愿望当然是放灯神自由啦"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "2.14天津《长腿叔叔》，本人cos了Jervis去看剧，我说“高杨你的替身来了”🐏“诶这人怎么跟我穿的一样”……后续互动完羊就去回答别的老师的问题了，当天风很大，老师们都让羊把大衣穿上，都在问羊“大衣呢”高杨看了我一眼“大衣在她身上呢”，我当时真的完全没有想到他会这样说。。哦买噶我很幸福当时。。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "先是很震惊，我觉得他八年来变化真的很大。18年的时候感觉还挺懵懂的，现在变得很成熟！然后是感觉挺心疼的，从美声专业转去音乐剧，没有舞蹈基础的情况下真的很难，我知道他当时一定做出了非常非常大的努力和辛苦。很敬佩他！感觉高哥认定的事情他一定会想办法做到的。\n一句话：你一定会越来越厉害，我们也一定会一直在！"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "包括但不限于上班、sd和签售时对大家的态度。我总觉得我花了钱演员在剧场表现要出色其他的有更好没有我也接受，其实有的时候我会感觉有些剧女老师的行为好像有些过界（嗯但我不敢说，比如离演员过近或者说一些不该说的话），但是我从来没见过高杨老师生气诶，不管怎么样，有主体性又温柔的人真的会在很多时刻让我感到很幸福吧！"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《Python基本教程》 教科书……不要让文科生学Python啊啊啊啊啊啊啊啊啊啊\n\n要说正经书的话是《献给阿尔吉侬的花束》，刚开始读，感觉是本很可爱的书。读后感暂时没有啦，也可能我本人就不是情感充沛的人，没有敏锐的感知力和共情能力，看书总是走马观花地就看完了…omg被短视频荼毒到没有耐心细细咀嚼书本内容。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "1做一部量身定做，集齐我想看所有设定的戏！\n2倒贴钱给他，让他当制作导演，我给予所有时间资金召集最好的卡，创造出下一个汉密尔顿！！！\n3（）声入人心一没塌的全部合体，录团综到90岁！\n\n1回到高杨小时候和他玩一个月（）\n2获得所有高杨戏的池一！\n3高杨每天快乐少加班连打，多休息，注意身体。所有乐高多多进剧场！"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "其实我最喜欢念他的名字。“名字是最短的咒语。”之前中学时期我看八月长安，书里提到“江百丽”的名字念到最后是口型是笑起来的，声调是扬上去的。其实高杨的名字也是这样啊，念起来是向上的。更何况他的名字总是伴随着让我幸福的剧场出现，每次想起看到或者念起来的时候都伴随着幸福出现。终于明白 幸福就是 要在剧场与你见面🎵"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "高哥感谢你的坚持和热爱❤️\n让我这种新粉可以在更大的舞台认识你、了解你、被你治愈。You still feel like home to me.🏠不必执着于找寻过去的自己，虽然当年开朗爱笑大男孩真的很治愈我，但是人总是在成长的过程中会不断改变，就让遗憾停留在回忆中吧~相信当下和未来的你永远是最好的你自己👍"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "一个亿：等自己能力资源成熟之后找个自己擅长的领域投资（现在的能力还不足以投资好，可能要先放银行存一段时间拿利息），当然拿去投资高老板的音乐剧也可以（哈哈哈哈哈\n\n许愿：\n1. 想要有个能快速成长的事业机会\n2. 想有时间去读几个世界各地的二硕三硕（贪心了好像跟第二个有点矛盾\n3. 想拥有一个舒适的房子（租房太累了"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "我也要写吗？那写吧\n\n《效白头吟体》\n\n雪拥蓝关道，冰悬玉树柯。\n极光垂北渚，铃铎采田歌。\n初见惊鸿影，重来鬓已皤。\n浮屠沉劫火，棋局隐干戈。\n欲语江潮咽，相看石马瘥。\n谁挑灯下衣，谁补雨中蓑？\n愿作天青破，莫教玄鸟罗。\n慈航终可渡，精诚未消磨。\n长夜心似铁，千秋月照河。\n但得一声彻，何辞百劫过。\n\n注意版权：照晚"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "欣慰、感动、骄傲。\n高杨你真的是一个特别特别特别棒的人，无论对你自己，还是对整个音乐剧市场，你都做出了创造性的努力。你也是我见过最热爱舞台，用心回馈粉丝的演员。我为我在茫茫人海中选择你而感到幸福，我永远都会是构成星光大合照众多光点的其中之一。只要你愿意唱，变成83岁老爷爷在街边提着笼子遛鸟散步，我也会去听你唱歌的。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《堂吉诃德的眼镜：小说细读二十讲》，是面向普通读者的文学导读和写作启示书。读后感悟是点醒了我在看一些剧本时的疑惑，之前很纠结本杰明里“爱和生命是一个圆”，生命为什么是圆这个问题，看完之后领悟了。开启了一个新的解读文本的角度，这本书其实是张秋子教授的课程整理出来的书，语言风格很生活化、容易读，在阅读的过程中就是舒服地被启发。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "《The case against the sexual revolution 》是一本关于女权题材的书。两性存在先天的生理与心理的差异，在男权社会的背景下，女性所接收到的信息本身是经过男性筛选的利他信息，而“situationship”可能看来很叛逆，但实际上是一种取悦男性的行为，强行抹平差异，统一标准，最终牺牲的永远是女性"}, {"q": "在你印象里，乐高之间身上最统一、最明显的特质是什么？", "a": "爱。大家被相同的人吸引自然会有相似点，虽然我看高杨也就一年多，但是我在剧场被乐高老师们帮助过好几次，很多乐高老师都是很好的女孩。而且我不擅长运动，我sd没有去过前排也没有递过东西，所以我的幸福感相当一部分来源于散场踱步到sd口看很多女孩眼睛亮亮地期待一次见面，期待把手中的礼物递出去，我觉得很喜欢一个人并为之努力是很勇敢的事情。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "«珍珠小姐»，是莫泊桑的短篇小说，两小时前刚刚读完，本来是为了写新剧本找灵感，但是读完后觉得，两个人相爱却因为客观原因而克制，甚至十余年只是默默埋于心底，算不算爱不自知不好说，算不算彼此守候也不好说，但是珍珠小姐就像她的名字，美丽、温润，把沙砾在疼痛中磨成了珍珠。一个人的兵荒马乱啊，有些时候，藏于岁月，说不出口，就已经是最深沉的了。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "王小波《黄金时代》，题材的话…应该是怪诞现实主义小说…？\n读后感：第二次看这本书还是云里雾里，似乎也看懂了些东西，两次看完之后，我总是先想到史铁生的那句话“在科学的迷茫之处，在命运的混沌之点，人唯有乞灵于自己的精神。不管我们信仰什么，都是我们自己的精神的描述和引导。”，无论如何，相信精神的力量吧，永远都要拥有坚定的内心，我的精神会给予我自由。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "有一个亿最想做的如果不考虑高哥的话可能是环游世界，考虑的话就是多多见面然后再投一下哥的音乐剧将和高杨工作室一同出现在出品单位名单上🙇🏻‍♀️\n许的第一个愿望是希望大家无论在生活中还是工作学习中都可以轻松一点吧。第二个愿望是有很多很多的钱（好俗套呀）callback第一问了，有了钱就能多多见面嗯对。第三个愿望，健健康康的吧平安过完一生（怎么感觉好奇怪）"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "亲爱的乐高们 谢谢大家的支持和陪伴 也谢谢你们能成为乐高 能够因为我走进剧场 看着每个人一笔一笔亲手写下的文字 就好像看见每一个鲜活的表达感情的人 其实看着每一次演出后的repo 会感受到我们的工作和付出的努力也是有意义的 包括每一次大家新手制作的物料 都能感受到每一个人的真诚热情 这个礼物跨越了千里 也是对我而言的美好的祝愿 谢谢每一个人的付出和真心🥰"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "其实我感触应该没有很深因为最早知道他就是srrx嘛当时我才初一 完全没有看微博追线下的概念 只是有时候会重刷srrx每次都会爱上不一样的人 第一次线下看剧还是大一上的期末周（长腿我永远追随你！）哎以前他来宁波演烟雾的我真的巨想看但那天我中考。很崩溃很可惜呀😭 然后有些事情就后来才慢慢刷到\n\n最想说的就是：辛苦啦谢谢你这么多年还在坚持 每天都要好好吃饭好好睡觉捏"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "1这次没看清人脸，我一定要在坐的近一点，好好看清gygg的帅气以及高端的演技\n2这次唱的太好听了，再加一场奖励下自己\n3这次sd太完美了，我还要d（也有可能是。这次比较i.被美貌震慑，还有问题没问出口，我下次一定要再问\n4这次状态有点差，下次一定可以调好的，再买一场看看，会不会有不同化学反应\n5都来到本地了，来都来了不看白不看\n6这个角色设定太绝了，我无法想象，去看！！！"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "好厉害。我也想成为这样的人。\n辛苦了。成熟的路上肯定有很多难熬的时刻，祝\n福未来一路顺遂。\n对于已经过去的苦难共情和理解意义没有那么大，希望高杨，莫愁千里路，自有到来风。\n偶尔怀念青涩小羊，但是看见小羊成为了这样的\n人，觉得很好，很骄傲\n恭喜你成为这么有趣鲜活的高杨，从初入行业的\n迷茫到稳扎稳打多重身份的成熟\n也恭喜我这么多人中认识了你\n我们都会前途无量\n\n谢谢有你在，你的存在本身就很好"}, {"q": "在人类历史长河中，最想穿越到哪个人物身上进行“时空回溯”，为什么？", "a": "“亚比该”，她是“大卫王”妻子之一，就是一个很有眼光的女人，虽说是二嫁妇但确实大卫为数不多的知己，不争不抢，想去见证大卫的“初恋”——“扫罗王”的女儿“米甲”公主和“挚爱”的女人—拔士巴，很慕强的待在大卫（他真的能文能武、有艺术细胞、长相帅气、精通音律、琴艺高超的诗人）身边，顺便见证一下人类历史上最有智慧的“所罗门”王还有那位神秘的不想被困于后宫深宅的“书拉密女”，想去看看那个年代的盛世。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "1乐高“们”有一个亿吗？是我们集体获得还是每个人都有？如果是集体获得，那作为粉丝群体，一个亿应该都拿来给高哥投资（？）；如果每个人都有，那我要先把家里收拾好，保证家里经济状况正常了，再把剩下的钱给高哥花，去追他的演出一类的hhh（这么有钱，这下真能当股东了）\n2还是同样的问题，是所有人共享一个灯神还是每个人都有啊哈哈哈哈哈。总之是高杨和乐高们都健健康康平平安安，剩下的再说吧。要是能给我点钱更好了？"}, {"q": "如果不从事现在这份工作，且有足够的经济基础，你最想从事的职业是？（🐑：还想做“兵哥哥”或者“牧民”嘛？为什么？）", "a": "高哥应该会去经商吧？因为羊爸羊妈也有经商经验和基础，感觉高哥也有点耳濡目染…？其实是猜的，高哥这么多年的出品制作工作都做得很好，在赚钱这方面也很有自己的见解，感觉他其实是一个很有经商天赋的人。\n如果是问我本人的话，我想去做配音演员/话剧演员。因为本科专业分流也是读的配音表演专业，大学四年学习期间也演过、配过很多角色，在大大小小的舞台上都展演过。但因为现实原因无法实现自己的梦想了（想起来真是有些遗憾啊…）。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "如果我有一个亿首先纳税，然后存起来八千万剩下的以高杨的名义做公益。再用每个月产生的利息买票进剧场\n如果有个灯神，首先再给我三个愿望，然后正式的第一个愿望希望一个亿成为现实（sorry高哥）第二个希望高杨一直平安快乐的做自己想做的任何事。第三个我希望回到2018年声入人心刚开播的时候，以现在的年龄和身份去看当年还算稚嫩的演出，弥补当年的遗憾，保护他不要被那个剧组欺负。剩下两个留着，如果以后高杨需要无条件赠与"}, {"q": "乐高们每次奔赴各地看高杨的演出，最大的执念是什么？", "a": "我想见他。\n其实我只在济南见过高杨，第一次是看寻找李二狗，她们说高杨很好看，我的朋友拉着我去蹲上班。济南的sd口是汽车通道，我过去的时候正好看到车过来高杨开着窗户和剧女老师们打招呼，其实我刚买了相机，但是那天我什么都没拍，我发现真的只用了眼睛记录的画面会留在心里，他的眼睛好漂亮。那天李二狗很好看，虽然我坐在三楼。到底谁在我看第一次之前和我说他唱歌不好听的哼！那天听完我就想看下一次了，看高杨是很幸福的事吧！"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "每一场奔赴都满溢着热烈的爱。来自不同城市、带着不同的风与温度，我们汇聚在小小的剧场中。一层、两层，还是三层，声浪从舞台蔓延至观众席，携带着创作者、演员、乐手、幕后人员的言语，和观众交换着、共同演绎着。这是非常幸福的瞬间。收到这份来自五湖四海的漂流手帐，仿佛看见了它跨越山海的来路，汇聚了大家的心意、喜爱与表达。文字的力量是无穷的。和现场不同，漂流手帐更直接地感受到来自乐高们的反馈和力量，将支撑着前行、探索、开拓。未来用更好的作品共同写下新的手帐吧。"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "我没有陪你一路走来，这或许有些遗憾，但我相信当下的你是我遇见的最好的你。或许八年前我没有被家人“断网”，我去看了综艺也不一定会喜欢上那时候的你，我们都在长大，直到遇见。大概每一次蜕变都来自于对经历的感悟，希望你的长大不要是因为刻骨铭心的失败和无法挽回的遗憾，希望你轻松一点，其实很多本来都是我对自己的期望，但是最终也没实现，那希望你能实现吧，我希望总该有很好的人得天独厚。\n祝福高杨，祝愿你有健康的身体，幸福的生活，和离实现愿望越来越近的路，加油吧朋友！"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "我的天，这也太隆重了\n首先很感谢各地的乐高为我制作这样一本漂流手帐，我在这里看到大家的真心，有喜欢很久的也有刚刚喜欢的。大家的每一句话每一个建议我都会认真看，然后采纳。其实在看手账的时候好几次热泪盈眶，大家都心意实在是太宝贵了，你们制作这样的手账从策划到实行也有很大的难度，最后把它送到我的手里，大家的喜爱像潮水一样淹没我，又推着我不断前进。这个手账也让我更明白我的身后有着大家的爱，我不用担心任何事永远有人站在我的身后关注我支持我的。谢谢，谢谢我的乐高们。"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "Q1：一个亿的话…………分类讨论一下。如果是天马行空一点的想法那就是拿钱狠狠的去给高杨投资…（投几部好的剧）如果要是回归现实的话那就是先存银行吃利息吃一段时间（毕竟本人没什么理财能力），等利息来到一个客观的数字之后就去拿钱给高杨狠狠的投资………（看出来我真的很想给高杨当股东了）\nQ2：愿望一：愿戏剧之神永远保佑虔诚的孩子们\n愿望二：愿所有符合社会主义核心价值观，在人类社会合理范围内的愿望都能得偿所愿\n愿望三：实现我的愿望一和愿望二\n（没错，就是这样唯物唯心对撞，三生万物好吧）"}, {"q": "如果“时光可以倒流”，你最想回到哪个跟高杨见面的哪个时刻？为什么？", "a": "如果真的有这个能力，我想去到每一个他需要鼓励支持陪伴的时刻。想站在他面前告诉他他已经足够好了，想告诉他他无需自我怀疑，想告诉他他已经把那束光带到观众身上了。\n话又说回来，如果真的要选择一个时段的话，我可能会选择十八岁初到维也纳的高杨。\n我可能有很多话同他讲，\n讲飘着雪的梅溪湖，讲长腿叔叔，讲北京的无数个夜晚，讲他可能遇到的挫折险阻，讲我们乐高，讲有很多人会支持他爱着他…………讲他的未来\n我恨不得把未来的一切都告诉他，把所有鼓励与支持都说给他听，\n但是站在我面前的是十八岁的高杨，\n他是高杨，\n是对着这个世界怀着一颗赤诚之心的高杨\n高杨有高杨的路要走\n所以我可能只会告诉他一句话：\n你会成为你想象中那个，出来闯荡世界顶天立地的男子汉。"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "我脑子里第一时间浮现出溜的就是那句“我的同担们是我担送给我的最好的礼物”\n我是一个ii的人同时呢也不太喜欢花时间去做功课 比如说在哪sd呀 最近有什么新的事情了呀 有什么瓜呀balabala的 我就一直秉持着随缘的原则刷到什么看什么 偶尔性质来了大搜特搜一番 做物料也懒懒的心血来潮会滑铲 然后有一次有个老师主动来加我还跟我聊了好多好多 后来她的物料都有我的一份我真的哭死 而且线下大家都很美好 我见到过精心打扮的精致小女孩 也见到过松弛随意的小女孩 见到过酷酷的女孩 也见到过甜甜的女孩 我有时候真的很羡慕🐑呀 在各个角落都有一个很好的女孩爱着他 甚至我也能因此分到一些她们的爱 \n就 哪怕哪天我对🐑 对音乐剧的热情减退了 我也觉得遇到这群小女孩是世界上最幸福的事"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "Q1直播说起《蓝关雪》时候的那种“身先士卒”，对自己职业的敬畏之心，让人狠狠动容，希望我们的传统文化可以在大家共同的努力下越来越棒👍🏻走出国门，走向更大的舞台给你世界一点小小的震撼；\nQ2直播的“容器论”，高哥你真的……很爱很爱“乐高”，知道承载着大家的“私欲”在砥砺前行，我们作为“水”也好，“酒”也罢，会默默守护你这个人美心善的小“🍸”，在不改变原有杯内液体的情况下，去侵入心血，拼尽全力为你遮风挡雨，不让你产生“冰裂”。\nQ3在分享你自己开始学习的事情，突然就想到生日会说的那句“无论什么时候，都永远不要失去从头开始的勇气”，三十岁正是开始学习的好年纪；关于“幸福的瞬间”的讨论，也让我想到在信里跟你说的“人总是为了幸福的瞬间而活着~”希望你能在治愈我们的同时，也被幸福的瞬间治愈❤️"}, {"q": "八年这一路走来，“乐高们”对高杨的成熟变化的心境是什么感触？最想对高杨八周年说的一句话是？", "a": "我入坑其实很晚，是25年北京李二狗首演才入的坑。我其实感受到他变化的并不多，唯一一点是他做出了一部让我觉得很成功的剧，《蓝关雪》。在我身边的朋友嘴里，这部剧基本是两极分化，要么说特别难看要么说特别好看，但我依然觉得高杨成功了。我能感受到他把本土的文化底蕴努力传达给我们，把多元化的元素融入音乐剧里塑造不同的角色表达不同的情感。我看的北京首演确实有一些瑕疵，但当戏剧演员在高台上唱戏我还是感叹本土文化底蕴深厚，我真的想哭。高杨的思维高度也是不用我多说，我能在他的一些采访里包括蓝关雪场刊里的致辞，都能感受到和他思维的共鸣。等到后续巡演会更成熟吧，观众也会更容易体会到这部剧的意义。希望以后能做出更多好剧，哥哥来北京我给你花钱！\n最想对高杨八周年说的一句话:高杨，你长得牛逼，活的更牛逼，祝你越活越牛逼啊"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "To:高杨\n不止150字，哥哥，我只参与了你事业中的一年半而已。在这一年半里我最欣慰的，是我成长的同时看到你也在成长，你给我带来了很大的动力还有人生收获，你一直在指引我向着好的方向发展。虽然我是梦女，但我一直想对你说，爱情的存在不是为了被承认，而是我们都能在爱里成长。我只需要站在你背后，支持你、给你带来快乐。我送你那么多比较“独特”的礼物，也是希望你在累了一场后，能多笑一笑！（我应该送过不少能让你有点印象的礼物，包括但不限于请你喝豆汁、风扇、三朵小红花配蒲扇、会吱吱叫的小羊帽子、小企鹅伞、见到朕为何不跪、紫狮安康、一米八的馕空调毯、木鱼）看到这儿笑了没有，你笑起来弯弯的眼尾真的很好看！\n我们还要经历很久的未来，希望我们每一次见到彼此时都有新的成长，那我的这份爱就被我们共同赋予了意义。我爱你，完全真心实意的，我爱你。\n——熄火下班了"}, {"q": "如果“乐高们”有“一个亿”最想做什么？如果“乐高们”有一个可以许愿的“灯神”，最想许的三个愿望是？", "a": "其实一个亿和灯神对我来说都是实现愿望的方式，区别是是否可以用钱来实现。总是说长大后养的第一个孩子是自己，那这一个亿我想留一部分给我和我的家人更好的生活，剩下的我希望用来支持包括但不限于先天性心脏病、抑郁症等疾病的治疗，一个一时半会不能治好的疾病除了生理病痛之外还有精神折磨，我经历过的伤害我希望再也不要出现在新的孩子身上。\n灯神的三个愿望：我的愿望有很大的三个主题：爱、自由与和平。我不止一次在面对某种情景的时候期待它们的到来。第一个愿望希望所有流动的爱意都被善待。第二个愿望希望我们每个人都有成为自己的自由。我可以选择不成为世俗意义上最优秀的人，但这不能否定我的全部。第三个愿望希望戏剧之外少一些冲突。小到个人大到世界，形容我们的不该是“用力地活着”而应该是幸福地活着。最后特别注意的一点是，我们——高杨和乐高们属于这里的“每个人”的范畴，我同时希望这些美好的愿望发生在我们身上，如果灯神还没出现，我要从我自己开始努力。"}, {"q": "在乐高们心中，高杨最治愈大家的一个瞬间是什么？或者哪类场景？哪个动作？哪个表情？哪件事？", "a": "访谈／直播，嘀嘀咕咕一些小羊看世界的方式和思考以及羊生趣事。\n\n个人而言，听高杨讲话有一种让心静下来的魔力，而且很巧的是每次特别烦躁，觉得受不了了这个世界对我设置的难度也太大了吧的时候，就\n都会得知今天要直播，之前还跟朋友感慨过，这个高杨怎么老挑着我心情最差的时候直播（但是也想问怎么星期三心情差的概率那么高！）\n\n于是挂着直播干活或者躺下，像听一个朋友分享生活，讲的还很有趣，看完了就没啥烦的了，至少在那个当下是这样，像听了一期博客，感觉被充电了一样，总会\"嘴角微微上翘\"。\n\n看访谈也一样，很多看世界的方式会让我豁然开朗，因为自己纠结内耗，求稳，对未知和未来会有一些灾难性幻想，这段时间看到高杨在更多领域的探索也给我一些勇气，好像去做也没有\n那么糟。\n\n我的脑子里也会有很多奇奇怪怪的想法，为什么这个词要这么组合呢？为什么给这个东西下了这个定义呢？所以在看高杨上一次大聊特聊什么魏晋谈道，什么外星人，什么思考，其实感觉很亲切，感觉可以思维发散大聊特聊一晚上。那天晚上其实也很难过，听着直播东拉西扯，思维也跟着跳，屏蔽了一些难过的事情，也同时又听到了很多金句。只要呼吸就是胜利，以后尽量践行。"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "现在么！？我曾经给高杨写过一首歌词，就把它放在这里吧。\n\n谢谢你\n作词:锦上鲤子\n\n[verse1]\n我或许永远不会知道\n你跨越了多远的距离\n披星戴月 来到这里\n当你看向我\n当我看向你\n剧场见三个字\n突然变得那么具体\n千里的奔赴 一句颤抖的\n请继续加油 我喜欢你\n\n[chorus1]\n谢谢你\n我是如此感激\n陪我经过一场场戏\n陪我走过一年四季\n谢谢你\n我是如此感激\n即使某天被告别被忘记\n从彼此世界消失得无声无息\n我仍记得星星曾亮起\n\n[verse2]\n我或许永远不会知道\n你为什么给予我爱意\n何时开始 哪时收起\n当你看向我\n当我看向你\n演员观众都在\n这一场戏梦人生里\n谢幕后醒来 在现实世界\n再把自己还给自己\n\n[chorus2]\n谢谢你\n我是如此感激\n陪我经过一场场戏\n陪我走过一年四季\n谢谢你\n我是如此感激\n即使某天被告别被忘记\n从彼此世界消失得无声无息\n我仍记得星星曾亮起\n\n[bridge]\n如果没有光\n舞台会消失在黑暗里\n你通红着眼\n我却看不到你哭泣\n只有掌声\n一次又一次响起\n\n[chorus3]\n谢谢你\n我是如此感激\n陪我经过一场场戏\n陪我走过一年四季\n谢谢你\n我是如此感激\n即使某天被告别被忘记\n从彼此世界消失得无声无息\n我只记得星星曾亮起\n\n[outro]\n谢谢你"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近读的书是《本杰明·巴顿奇事》。因为5月去看了高哥本杰明末场，真的很喜欢很喜欢这个故事，所以把电影版和原著全部拉出来看了一遍。\n看完之后很震撼，这份感情是来自灵魂深处的。可能这样说有些夸张，但我实实在在的，在看完故事之后发愣了很久。词不达意，只能略微浅薄的表达我的感受。\n本杰明一直在失去中寻找生命的答案，但他到最后一刻也没有找到。本杰明生命中所有出现的人，都是他当下人生的推手，他们构成了一条完整的绳索，让本杰明沿着这个“返老还童”的诡异生长过程，成为了一个“年迈的孩子”。帮助过他的奎妮、麦克，给他人生带来意外的伊丽莎白、托马斯，他的妻子黛西和他的孩子。所有人，都在试图教会本杰明——“得到”和“失去”。\n就像音乐剧版奎妮告诉本杰明的“爱和生命从来都不是单向的河流，而是一个圆”。这也是本剧我最喜欢的一句台词，当奎妮哭着抚摸本杰明的脸，情真意切地告诉他这个道理的时候，本杰明的人物形象也在这一刻彻底成立了。\n《本杰明·巴顿奇事》并不是很长的一本书，它只需要花费一点时间就能看完。原著更多描绘的也是爱情，也因为是短篇的原因，人物刻画并不那么细腻。但这本书还是让我思考：成长和变老，到底哪个更难？人生的价值，到底在于生命的长度，还是每一天的经历？\n我想我会经常回味电影版和原著，当然了，音乐剧版要是巡到我的ip地我也会毫不犹豫的奔赴。"}, {"q": "最近一次读的书是什么？什么题材的？有什么读后感悟吗？", "a": "最近读完的是《苏轼传--诗酒趁年华》，但其实大部分都在读一些近代史的书（历史专业天天写读后感写书评写论文是这样的）\n\n这本书，就和名字一样讲述了苏轼的一生，因为很喜欢苏轼的诗词所以找了挺多苏轼的书来看。\n\n刚读完的这本相当于苏轼故事更深入的汇编，包涵每个时期的诗词，文学性色彩比较浓，历史史实不知道有没有考据，看完对于苏轼理解更多，但是感悟没有特别特别深。最有感悟的其实是挺久之前读的一本《天蓝色的彼岸》，这本书很轻巧，页数不多，很容易读，甚至可以说是有点偏儿童文学，但适合不带脑子放空读。天蓝色的彼岸，在书中设定的是，只有毫无牵挂之人才可以到达的地方。主角小哈里在出车祸前和姐姐吵了一架，说“如果有一天我死了，你会后悔的”，车祸后他变成了类似幽灵，一直希望和姐姐道歉，好好说句再见。他以死亡后的视角，遇到了一位很老的有执念的幽灵，和他一起看到了原先世界没了他以后的后续走向，虽然有所出入但也在慢慢释然。最终通过很温暖的方式终于了了执念。\n\n感悟就是就像书中说的，死亡“就像是弹了弹手指，关掉了灯。上一秒钟你还在那里，下一秒钟就走了。一开，一关，就这么简单。”，我们不要再等待某个时间点再去做什么事，也不要在活着的时候说很多伤人的话，好好珍惜每次的再见。这是本关于死亡与执念的书，对于死亡命题叙述的很轻巧，死并非生的对立面，而是作为生的一部分永存，过好每一天，每一天都完整地没有遗憾地去度过，永远不要在愤怒中等待日落，不要带着遗憾迎接死亡。"}, {"q": "什么时候可以看到高杨自编自导自演自己工作室出品的作品呢？最想看的题材类型是？表达的价值观是？", "a": "历史类？感觉历史上可以取材的太多太多，国外可以有做得很好的历史人物类、历史事件类作品，国内也可以摸索尝试，中国文化诗词历史太多精华可以写，只是尝试也可以\n\n从一个小切口，让大家对这段历史或是文化产生一些兴趣，哪怕仅仅看完后只是去简单了解了一下也很好。因为音乐剧有部分的受众面还是学生，通过文化作品来对文化产生兴趣，我觉得是最有意思且能够持久的方式\n\n且现在历史虚无主义，很多颠倒的历史观历史史实，也会有极端媚外的文化思想，可能会有小部分人被带偏，没有说要让作品去纠正这些人的思维，这太难了，但是希望能够多一点点人通过作品去了解正确的历史和文化。\n\n最近感触特别深的是，即使离我们最近的中国近代史，即使是已经成为一个运动的领袖了，只是因为牺牲太早，就只能成为历史课本上的“等等”两个字，甚至是专业学习历史，历史教科书上还是没有拓展，只有自己去找去看这类资料才能知道，这些人这些事都应该被记住被知道，所以很想有朝一日可以看到一个比较完善的历史类或者文化类音乐剧，有完整的史实考证和逻辑，可能需要很久，可能不一定是“高杨”做出来，但也在期待有这样的作品。看到高杨其实有意识地在做《蓝关雪》这样的音乐剧，非常之高兴，同时也期待高杨可以进行更多的探索！\n\n现在其实已经在探索路上了，期待会有中国的汉密尔顿（不是），在学世界近代史的时候，即使课上只会一笔带过亨利八世和他的六个皇后，但是我们还有six这个作品让我们拓展，把她们鲜活地呈现出来，类似这样吧，希望我们也可以做出来"}, {"q": "看完漂流手账之后，请写150字的读后感（或者一篇诗歌），来抒发一下对乐高们的情感", "a": "以下的文字记录于南方漂流手账的尾声，目前还有7位老师还没有交到我手里（相比北方和中部地区还有9人没有联系上，我觉得我负责的南方地区的乐高老师们已经很配合我的工作啦🙏）。高哥，我真的不知道，我是怎么从被拉进群里的活动参与者，一步步变成全程操盘的执行者+中后期策划者，这难道就是ENTJ--天选“指挥官”的魅力🤔之前的我也没有组织过什么大型活动，顶多也就是组织公司三四十人的小组团建全程或者在百十来人的活动中做一天的主持人和策划者（但都是有搭档跟我一起分担的，不过这次两位搭档【忒妮亚斯】和【熄火下班了】老师也很棒啦👍），真的很担心做的不够好，达不到预期，怕收上来的份数大大缩水（事实证明墨菲定律是真的），怕你失望，活动期间的难处我们不谈，但是真心希望你在收到3本漂流手账的时候可以感受到我们来自五湖四海的爱❤️，在你的人生中的幸福瞬间里留下浓墨重彩的一笔。（我在去看《蓝关雪》之前的信里曾跟你说过成为高杨是件幸福的事情，这句话现在是不是切身体会到了呀？！在每个角落都有爱着你的乐高，想想就很满足吧😊在审稿的过程中，我无数次留下感性的小珍珠，我只能说你小子真的艳福不浅）虽说没有实打实的跟你走完这8年，但是在补课的时候，我深切地感受到你的变化还是很大的，我想通过这次活动告诉你（如果你看完整册应该会发现这三句话在不同的本子里）：\n①爱不是负担，而是给你去尝试不同选择的勇气💪\n②爱让相遇成为礼物🎁\n③一切的相遇就是爱的证明，原来爱会修补心的缺口❤️\n-Esthabel💫 \n2026.10.30"}, {"q": "你最喜欢给“高杨”起过哪个昵称？为什么？", "a": "哥哥。最浅显的原因是高哥比我大，其次是高哥的确是在我人生迷茫的时候“拉”过我一把的人。我是二战考研选手，最后失败转到留学赛道。\n第一次考研成绩出来之后我很颓废，分数只差几分就可以进面，调剂的学校又不愿意将就。那段时间我一直在想我是不是一个很失败的人。很多人问我要不要再试试，毕竟这一次并没有差很多。但我选择了逃避，我痛痛快快的玩了一整个大四下半学期。圆满完成了我的毕设和论文之后，我选择和朋友开启毕业旅行。直到毕业回家，当家人再一次问起我，到底是工作还是二战的时候，我才惊觉，原来我现在就是要面临这样“不得不”的局面。现在的就业市场就是很残忍，不允许gap，不允许空窗，不允许没有意义的休假。所有人都要为生计忙碌起来。所以我选择再来一次。\n二战的时候我很焦虑，我害怕会比第一次的情况更差。每天晚上焦虑到睡不着的时候都会翻出高哥以前的采访和各种切片。可以说那段时间完全是靠高哥支撑着我的神经。\n高哥说过两句话我印象特别特别深刻，第一句是“很多事情不要给自己设那么高的上限，你要做的是拓宽你的曲线，而不是说把整体越抬越高”，第二句是“22岁有什么可焦虑的呢？你看我22岁的时候焦虑吗？”。很巧，我当时看到这句话的时候刚过完22岁的生日。瞬间就宽慰了我强烈的不安情绪。即便我第二次考研还是以进面后失败告终。但我也有勇气为我自己的未来努力一把，所以我申请了留学，现在也顺利拿到了offer，9月就入学读研啦！\n写了这么多，只是想表达，高哥对我来说是可以让我安心的人。他是一个说话做事会让大家觉得很有信服力的人，我愿意听他的试一试。这可能是高杨这个人带给我最强的正向能量。他就像存在在我世界里的哥哥一样，一直温暖我，鼓励我。"}];
